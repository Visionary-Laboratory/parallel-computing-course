<rect x="455" y="120" width="130" height="57" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="520.0" y="155.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">0</text>
<rect x="610" y="120" width="130" height="57" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="675.0" y="155.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
