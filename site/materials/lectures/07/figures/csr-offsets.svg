<text x="520.0" y="255.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="610" y="220" width="130" height="57" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="675.0" y="255.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="765" y="220" width="130" height="57" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
