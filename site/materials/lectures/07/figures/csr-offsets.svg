<text x="985.0" y="255.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<text x="48" y="390" font-size="23" fill="#20372F" text-anchor="start" font-weight="700">输出槽</text>
<rect x="300" y="353" width="113" height="66" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="356.5" y="393.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">行 0</text>
<rect x="423" y="353" width="113" height="66" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
