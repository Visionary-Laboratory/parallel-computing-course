<text x="602.5" y="393.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">行 2</text>
<rect x="669" y="353" width="113" height="66" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="725.5" y="393.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">行 2</text>
<rect x="792" y="353" width="113" height="66" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="848.5" y="393.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">行 2</text>
<rect x="915" y="353" width="113" height="66" rx="8" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="971.5" y="393.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">行 3</text>
<text x="560" y="468" font-size="23" fill="#566A63" text-anchor="middle" font-weight="400">行 1 是空行：[2,2)；它没有输出槽，但仍有自己的边界。</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">两次邻居遍历必须使用同一输入版本与判据，才能让计数和实际填入长度一致。</text>
</g></svg>
