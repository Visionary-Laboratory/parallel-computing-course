<text x="555" y="456" font-size="24" fill="#176B52" text-anchor="middle" font-weight="700">求和 → atomicAdd / 分段归约；稳定输出 → 先计算独占写位置</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">对冲突位置普通写入没有“最后一个输入获胜”的保证；若要求该语义，必须显式组织顺序。</text>
