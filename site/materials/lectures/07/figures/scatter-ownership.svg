<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">Scatter 能否直接写，取决于目标是否唯一</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">同样是 out[index[i]] = value[i]，索引性质决定它是不是一个有竞争的程序。</text>
