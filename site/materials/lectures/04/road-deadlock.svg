<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="t d"><title id="t">死锁：各占一段路，谁也不肯先退出</title><desc id="d">规则：每段仅能容纳一辆车，未取得下一段前保留当前段，双方均不主动后退。两车占着A和B等待对方的路段，形成循环等待。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1120" height="430" rx="8" fill="#f8faf7" stroke="none"/><text x="560" y="40" text-anchor="middle" font-size="27" fill="#20372f">死锁：各占一段路，谁也不肯先退出</text><rect x="75" y="150" width="970" height="135" rx="8" fill="#e2e7e5" stroke="none"/><rect x="95" y="160" width="450" height="115" rx="8" fill="#e4f2eb" stroke="#176b52"/><rect x="575" y="160" width="450" height="115" rx="8" fill="#e7f1f8" stroke="#246b96"/><text x="320" y="109" text-anchor="middle" font-size="24" fill="#176b52">路段 A：被绿车占着</text><text x="800" y="109" text-anchor="middle" font-size="24" fill="#246b96">路段 B：被蓝车占着</text><rect x="250" y="205" width="78" height="38" rx="8" fill="#176b52" stroke="none"/><rect x="328" y="215" width="26" height="28" rx="8" fill="#176b52" stroke="none"/><rect x="333" y="218" width="15" height="10" rx="2" fill="#eaf6ff" stroke="none"/><circle cx="270" cy="246" r="8" fill="#243a33"/><circle cx="334" cy="246" r="8" fill="#243a33"/><text x="302" y="192" text-anchor="middle" font-size="20" fill="#176b52">绿车 →</text><rect x="789" y="205" width="78" height="38" rx="8" fill="#246b96" stroke="none"/><rect x="765" y="215" width="26" height="28" rx="8" fill="#246b96" stroke="none"/><rect x="770" y="218" width="15" height="10" rx="2" fill="#eaf6ff" stroke="none"/><circle cx="785" cy="246" r="8" fill="#243a33"/><circle cx="849" cy="246" r="8" fill="#243a33"/><text x="817" y="192" text-anchor="middle" font-size="20" fill="#246b96">← 蓝车</text><path d="M365 221 L540 221" stroke="#176b52" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 221 L580 221" stroke="#246b96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="320" y="325" text-anchor="middle" font-size="23" fill="#20372f">占着 A，等 B 腾空</text><text x="800" y="325" text-anchor="middle" font-size="23" fill="#20372f">占着 B，等 A 腾空</text><text x="560" y="378" text-anchor="middle" font-size="24" fill="#20372f">双方都不退让：A 等 B，B 又等 A，形成等待环。</text></g></svg>