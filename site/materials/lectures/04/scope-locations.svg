<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="t d"><title id="t">先定位参与交接的线程</title><desc id="d">GPU内，线程块0包含A和B，线程块1包含C；CPU线程D位于GPU之外。同块、跨块、跨CPU与GPU三类交接需要相应范围的同步。</desc><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#20372f;font-size:23px}.h{font-size:25px;font-weight:600}</style><rect width="1120" height="290" rx="12" fill="#f8faf7"/><rect x="20" y="25" width="770" height="235" rx="14" fill="#eef5f1" stroke="#176b52" stroke-width="2"/><text x="405" y="62" text-anchor="middle" class="h">同一张 GPU（device）</text><rect x="45" y="85" width="345" height="145" rx="10" fill="white" stroke="#176b52"/><rect x="420" y="85" width="345" height="145" rx="10" fill="white" stroke="#246b96"/><text x="217" y="121" text-anchor="middle">线程块0（block）</text><text x="592" y="121" text-anchor="middle">线程块1（block）</text><rect x="66" y="150" width="133" height="51" rx="8" fill="#e4f2eb"/><rect x="232" y="150" width="133" height="51" rx="8" fill="#e4f2eb"/><text x="132" y="184" text-anchor="middle">线程 A</text><text x="298" y="184" text-anchor="middle">线程 B</text><rect x="525" y="150" width="133" height="51" rx="8" fill="#e7f1f8"/><text x="591" y="184" text-anchor="middle">线程 C</text><rect x="830" y="85" width="270" height="145" rx="10" fill="#fff1ce" stroke="#936015"/><text x="965" y="125" text-anchor="middle" class="h">CPU</text><text x="965" y="184" text-anchor="middle">线程 D</text></svg>
