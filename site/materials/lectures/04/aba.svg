<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>同一指针值掩盖不同历史的 ABA 三步示例</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#246548"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="35" font-size="24" fill="#254b38" text-anchor="start" font-weight="600">ABA：指针又等于 A，链表却已不是原来的链表</text><text x="24" y="95" font-size="18" fill="#254b38" text-anchor="start" font-weight="400">① T0 读取后暂停</text><rect x="445" y="63" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="483.0" y="96.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">A</text><path d="M524,89 L550,89" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="557" y="63" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="595.0" y="96.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">B</text><path d="M636,89 L662,89" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="669" y="63" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="707.0" y="96.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">C</text><text x="445" y="146" font-size="16" fill="#2d6f99" text-anchor="start" font-weight="400">记住 expected=A、next=B</text><text x="24" y="214" font-size="18" fill="#254b38" text-anchor="start" font-weight="400">② T1 弹出 A、压入 D、再压入 A</text><rect x="445" y="182" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="483.0" y="215.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">A</text><path d="M524,208 L550,208" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="557" y="182" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="595.0" y="215.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">D</text><path d="M636,208 L662,208" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="669" y="182" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="707.0" y="215.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">B</text><path d="M748,208 L774,208" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="781" y="182" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="819.0" y="215.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">C</text><text x="445" y="265" font-size="16" fill="#2d6f99" text-anchor="start" font-weight="400">top 又是 A，但 A.next 已是 D</text><text x="24" y="333" font-size="18" fill="#254b38" text-anchor="start" font-weight="400">③ T0 的 CAS(top, A, B) 成功</text><rect x="445" y="301" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="483.0" y="334.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">B</text><path d="M524,327 L550,327" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="557" y="301" width="76" height="52" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="595.0" y="334.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">C</text><text x="445" y="384" font-size="16" fill="#2d6f99" text-anchor="start" font-weight="400">D 被错误跳过；只比较 top 没发现变化</text><text x="24" y="459" font-size="17" fill="#607668" text-anchor="start" font-weight="400">给 top 加版本号可以帮助识别历史变化；避免悬空指针，还需要 hazard pointer / epoch 等回收协议。</text></svg>