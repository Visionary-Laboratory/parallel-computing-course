<text x="175" y="354" text-anchor="middle" class="small">双方同时重试，再次碰头</text></g>
<path d="M940 388V405H190V388" stroke="#936015" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="560" y="443" text-anchor="middle" class="body">再次退让、再次重试……动作不断重复，有效工作却没有完成。</text></svg>