<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="t d"><title id="t">活锁：同一窄路，两车同时进、同时退、再同时进</title><desc id="d">俯视图，道路从两端宽路收窄为中间单车道，两辆车无法在瓶颈中会车。第一帧两车靠近入口，第二帧车退回两端，第三帧再次靠近。绿色车始终朝右，蓝色车始终朝左；退让时保持车头方向倒退。循环重试，无车通过。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="bank" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f0e9d9"/><path d="M0 8L8 0" stroke="#e1d4b9" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#20372f}.head{font-size:24px;font-weight:600}.body{font-size:20px}.small{font-size:18px}</style><rect width="1120" height="460" rx="12" fill="#f8faf7"/><text x="560" y="36" text-anchor="middle" class="head">活锁：一直在礼让、重试，却没有一辆通过</text><text x="560" y="65" text-anchor="middle" class="body">俯视图 · 中间只能容一辆车宽，两车无法并排会车</text>
<g transform="translate(15,0)"><rect x="0" y="87" width="350" height="289" rx="12" fill="white" stroke="#cfdcd5"/>
<text x="175" y="124" text-anchor="middle" class="head">① 同时前进</text>
