<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="t d"><title id="t">饥饿：别人一直能走，只有我总轮不到</title><desc id="d">主路蓝色卡车持续通过，支路绿色卡车因主路优先规则一直等待。系统整体通行，但某个参与者长期得不到服务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1120" height="430" rx="8" fill="#f8faf7" stroke="none"/><text x="560" y="40" text-anchor="middle" font-size="27" fill="#20372f">饥饿：别人一直能走，只有我总轮不到</text><rect x="50" y="145" width="1020" height="100" rx="8" fill="#e2e7e5" stroke="none"/><rect x="460" y="245" width="110" height="110" rx="8" fill="#e2e7e5" stroke="none"/><rect x="170" y="178" width="78" height="38" rx="8" fill="#246b96" stroke="none"/><rect x="248" y="188" width="26" height="28" rx="8" fill="#246b96" stroke="none"/><rect x="253" y="191" width="15" height="10" rx="2" fill="#eaf6ff" stroke="none"/><circle cx="190" cy="219" r="8" fill="#243a33"/><circle cx="254" cy="219" r="8" fill="#243a33"/><text x="222" y="165" text-anchor="middle" font-size="20" fill="#246b96">主路车1 →</text><rect x="620" y="178" width="78" height="38" rx="8" fill="#246b96" stroke="none"/><rect x="698" y="188" width="26" height="28" rx="8" fill="#246b96" stroke="none"/><rect x="703" y="191" width="15" height="10" rx="2" fill="#eaf6ff" stroke="none"/><circle cx="640" cy="219" r="8" fill="#243a33"/><circle cx="704" cy="219" r="8" fill="#243a33"/><text x="672" y="165" text-anchor="middle" font-size="20" fill="#246b96">主路车2 →</text><rect x="870" y="178" width="78" height="38" rx="8" fill="#246b96" stroke="none"/><rect x="948" y="188" width="26" height="28" rx="8" fill="#246b96" stroke="none"/><rect x="953" y="191" width="15" height="10" rx="2" fill="#eaf6ff" stroke="none"/><circle cx="890" cy="219" r="8" fill="#243a33"/><circle cx="954" cy="219" r="8" fill="#243a33"/><text x="922" y="165" text-anchor="middle" font-size="20" fill="#246b96">主路车3 →</text><rect x="390" y="302" width="78" height="38" rx="8" fill="#176b52" stroke="none"/><rect x="468" y="312" width="26" height="28" rx="8" fill="#176b52" stroke="none"/><rect x="473" y="315" width="15" height="10" rx="2" fill="#eaf6ff" stroke="none"/><circle cx="410" cy="343" r="8" fill="#243a33"/><circle cx="474" cy="343" r="8" fill="#243a33"/><text x="442" y="289" text-anchor="middle" font-size="20" fill="#176b52">支路绿车：一直等</text><path d="M505 325 L515 256" stroke="#176b52" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="560" y="99" text-anchor="middle" font-size="24" fill="#20372f">规则：主路车一直优先，支路必须等待空隙</text><text x="805" y="310" text-anchor="middle" font-size="24" fill="#246b96">主路车辆持续通过 ✓</text><text x="805" y="350" text-anchor="middle" font-size="24" fill="#176b52">支路绿车始终没轮到 ✕</text><text x="560" y="402" text-anchor="middle" font-size="23" fill="#20372f">整体有进展，但某一辆车长期得不到通行机会。</text></g></svg>