<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="t"><title id="t">错误做法：先算完的块不退出，后面的块无法开始</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1120" height="420" rx="10" fill="#f8faf7" stroke="none" stroke-width="2"/><text x="560" y="38" text-anchor="middle" font-size="26" fill="#20372f">错误做法：先算完的块不退出，后面的块无法开始</text><rect x="25" y="66" width="650" height="223" rx="10" fill="#eef5f1" stroke="#176b52" stroke-width="2"/><text x="350" y="103" text-anchor="middle" font-size="24" fill="#20372f">两个执行位置：仍被等待者占着</text><rect x="45" y="125" width="290" height="140" rx="10" fill="#fff1ce" stroke="#b58024" stroke-width="2"/><text x="190" y="160" text-anchor="middle" font-size="24" fill="#20372f">块0：已算出 10</text><text x="190" y="201" text-anchor="middle" font-size="21" fill="#20372f">仍循环等待“全部完成”</text><text x="190" y="241" text-anchor="middle" font-size="20" fill="#20372f">没有退出 → 不释放位置</text><rect x="360" y="125" width="290" height="140" rx="10" fill="#fff1ce" stroke="#b58024" stroke-width="2"/><text x="505" y="160" text-anchor="middle" font-size="24" fill="#20372f">块1：已算出 20</text><text x="505" y="201" text-anchor="middle" font-size="21" fill="#20372f">仍循环等待“全部完成”</text><text x="505" y="241" text-anchor="middle" font-size="20" fill="#20372f">没有退出 → 不释放位置</text><rect x="835" y="125" width="260" height="140" rx="10" fill="#e7f1f8" stroke="#246b96" stroke-width="2"/><text x="965" y="163" text-anchor="middle" font-size="24" fill="#20372f">块2：排队中</text><text x="965" y="205" text-anchor="middle" font-size="21" fill="#20372f">没空位，算不出30</text><path d="M680 181L825 181" stroke="#b58024" stroke-width="3" marker-end="url(#a)"/><text x="753" y="160" text-anchor="middle" font-size="20" fill="#20372f">等块2</text><path d="M965 274V324H350V294" fill="none" stroke="#246b96" stroke-width="3" marker-end="url(#a)"/><rect x="590" y="306" width="250" height="34" rx="10" fill="#f8faf7" stroke="none" stroke-width="2"/><text x="715" y="331" text-anchor="middle" font-size="20" fill="#20372f">块2反过来等空位</text><text x="560" y="382" text-anchor="middle" font-size="24" fill="#20372f">GPU全局内存里的结果：[ 10，20，尚未写入 ] → 无法汇总</text></g></svg>