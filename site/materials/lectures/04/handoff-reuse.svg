<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">重复使用：结果交出去之后，还要把空间还回来</title><desc id="d">两个方向都要交接：A → B 保证读前写好；B → A 保证覆盖前读完。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#566a63"/></marker></defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#20372f}.h{font-size:24px;font-weight:600}.b{font-size:22px}.s{font-size:19px}</style><rect width="1200" height="330" rx="12" fill="#f8faf7"/><text x="600" y="42" text-anchor="middle" class="h">重复使用：结果交出去之后，还要把空间还回来</text>
<rect x="20" y="80" width="266" height="168" rx="10" fill="#e4f2eb" stroke="#176b52"/><text x="153" y="121" text-anchor="middle" class="h">① A 写好 42</text><text x="153" y="173" text-anchor="middle" class="b">ready：false → true</text><text x="153" y="218" text-anchor="middle" class="s">release：通知可以读</text>
<path d="M290 160h23" stroke="#566a63" stroke-width="2" marker-end="url(#a)"/>
<rect x="318" y="80" width="266" height="168" rx="10" fill="#e7f1f8" stroke="#246b96"/><text x="451" y="121" text-anchor="middle" class="h">② B 取走 42</text><text x="451" y="173" text-anchor="middle" class="b">复制到 local_result</text><text x="451" y="218" text-anchor="middle" class="s">acquire 收到通知后读取</text>
<path d="M588 160h23" stroke="#566a63" stroke-width="2" marker-end="url(#a)"/>
<rect x="616" y="80" width="266" height="168" rx="10" fill="#e7f1f8" stroke="#246b96"/><text x="749" y="121" text-anchor="middle" class="h">③ B 归还空间</text><text x="749" y="173" text-anchor="middle" class="b">ready：true → false</text><text x="749" y="218" text-anchor="middle" class="s">release：通知已经读完</text>
<path d="M886 160h23" stroke="#566a63" stroke-width="2" marker-end="url(#a)"/>
<rect x="914" y="80" width="266" height="168" rx="10" fill="#e4f2eb" stroke="#176b52"/><text x="1047" y="121" text-anchor="middle" class="h">④ A 才能写 99</text><text x="1047" y="173" text-anchor="middle" class="b">覆盖共享 result</text><text x="1047" y="218" text-anchor="middle" class="s">acquire 收到空闲通知</text>
<text x="600" y="294" text-anchor="middle" class="s">两个方向都要交接：A → B 保证读前写好；B → A 保证覆盖前读完。</text></svg>