<text x="56" y="579" font-size="22" fill="#936015" text-anchor="start" font-weight="400">放大第 5 步：T1 已有 S · [42,0]，先申请整行写权限，使 T0 的副本失效。</text>
<text x="56" y="615" font-size="22" fill="#20372F" text-anchor="start" font-weight="400">获准后只把 y 改成 9，保留 x=42 → M · [42,9]；不需要程序先 read(y)。</text>
<line x1="32" y1="671" x2="1088" y2="671" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="700" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">M：独占可写；S：共享只读；I：不可使用。本模型脏行响应读请求时回写主存。</text>
