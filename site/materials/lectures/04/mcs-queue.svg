<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img"><title>MCS 队列锁的节点、自旋位置与交接</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#246548"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="35" font-size="25" fill="#254b38" text-anchor="start" font-weight="600">MCS：每个等待者轮询自己的节点</text><rect x="25" y="105" width="290" height="95" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="40" y="134" font-size="20" fill="#254b38" text-anchor="start" font-weight="600">T0 · 持锁</text><text x="40" y="162" font-size="16" fill="#526d5d" text-anchor="start" font-weight="400">临界区正在执行</text><rect x="360" y="105" width="290" height="95" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="375" y="134" font-size="20" fill="#254b38" text-anchor="start" font-weight="600">T1 · 等待</text><text x="375" y="162" font-size="16" fill="#526d5d" text-anchor="start" font-weight="400">轮询 node1.locked</text><rect x="695" y="105" width="290" height="95" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="710" y="134" font-size="20" fill="#254b38" text-anchor="start" font-weight="600">T2 · 等待</text><text x="710" y="162" font-size="16" fill="#526d5d" text-anchor="start" font-weight="400">轮询 node2.locked</text><path d="M322,148 L352,148" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><path d="M657,148 L687,148" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><text x="824" y="80" font-size="18" fill="#2d6f99" text-anchor="middle" font-weight="400">tail 指向 T2 的节点</text><rect x="25" y="251" width="952" height="78" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="40" y="280" font-size="20" fill="#254b38" text-anchor="start" font-weight="600">交接：T0 解锁，只通知直接后继 T1</text><text x="40" y="308" font-size="16" fill="#526d5d" text-anchor="start" font-weight="400">T1 收到交接后进入临界区；T2 继续轮询自己的标志。</text><text x="25" y="379" font-size="19" fill="#254b38" text-anchor="start" font-weight="400">入队仍需原子更新 tail；“本地轮询”减少所有等待者争抢同一个 serving 字段。</text><text x="25" y="420" font-size="18" fill="#607668" text-anchor="start" font-weight="400">节点必须活到交接完成；后继正在入队时，解锁者还需处理 next 指针尚未连上的窗口。</text></svg>