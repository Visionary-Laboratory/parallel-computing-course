<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">消失的中间矩阵，比更快的单次 GEMM 更关键</title><desc id="desc">消失的中间矩阵，比更快的单次 GEMM 更关键。对比数学计算完全相同的两种数据组织；只标出大尺寸中间结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">消失的中间矩阵，比更快的单次 GEMM 更关键</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">对比数学计算完全相同的两种数据组织；只标出大尺寸中间结果。</text>
<text x="50" y="146" font-size="24" fill="#20372F" text-anchor="start" font-weight="700">朴素物化</text>
<rect x="227" y="115" width="164" height="70" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="309.0" y="157.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">QKᵀ</text>
<rect x="414" y="115" width="164" height="70" rx="8" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="496.0" y="157.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">HBM：S</text>
<rect x="609" y="115" width="164" height="70" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="691.0" y="157.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">Softmax</text>
<rect x="804" y="115" width="164" height="70" rx="8" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="886.0" y="157.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">HBM：P</text>
<line x1="391" y1="150" x2="408" y2="150" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="579" y1="150" x2="601" y2="150" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="775" y1="150" x2="797" y2="150" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="988" y="158" font-size="20" fill="#20372F" text-anchor="start" font-weight="400">→ PV</text>
<text x="50" y="275" font-size="24" fill="#20372F" text-anchor="start" font-weight="700">分块融合</text>
<rect x="222" y="232" width="806" height="182" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<rect x="247" y="267" width="238" height="79" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="366.0" y="313.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">Q tile × K tile</text>
<line x1="488" y1="306" x2="502" y2="306" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="508" y="267" width="238" height="79" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="627.0" y="313.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">局部分数 → 权重</text>
<line x1="749" y1="306" x2="763" y2="306" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="769" y="267" width="238" height="79" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="888.0" y="313.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">更新 (r, ℓ, u)</text>
<text x="625" y="389" font-size="22" fill="#20372F" text-anchor="middle" font-weight="400">片上循环读取 K/V；末尾写出 O 和逐行统计量</text>
<text x="558" y="472" font-size="24" fill="#20372F" text-anchor="middle" font-weight="700">没有全尺寸 S/P 的 HBM 落地，不代表没有二次计算量。</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">示意未画 Q/K/V 的全部搬运、缓存与工作区；各实现的具体流量仍需要测量。</text>
</g></svg>
