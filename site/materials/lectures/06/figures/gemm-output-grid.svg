<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" role="img" aria-labelledby="title desc">
<title id="title">32×32 输出矩阵由四个 block 分块计算</title><desc id="desc">grid 为2×2，block 为16×16。blockIdx按x、y标注：左上(0,0)，右上(1,0)，左下(0,1)，右下(1,1)。每个block负责16×16个不同输出，每线程一个输出。右上block的行号为0到15，列号为16到31。每个block遍历完整K维度，各输出块写入C的不同位置。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39799b"/></marker>
</defs>
<rect width="1240" height="440" rx="12" fill="#fff"/>
<g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" fill="#20372f">
  <text x="310" y="32" text-anchor="middle" font-size="25" font-weight="700">输出矩阵 C：32×32</text>
  <g fill="#566a63" font-size="19" text-anchor="middle">
    <text x="230" y="67">列 0–15</text><text x="390" y="67">列 16–31</text>
  </g>
  <g fill="#566a63" font-size="19" text-anchor="end">
    <text x="134" y="167">行 0–15</text><text x="134" y="327">行 16–31</text>
  </g>
  <rect x="150" y="84" width="160" height="160" fill="#e7f2eb" stroke="#7fa68d" stroke-width="2"/>
  <rect x="310" y="84" width="160" height="160" fill="#e3eff8" stroke="#39799b" stroke-width="3"/>
  <rect x="150" y="244" width="160" height="160" fill="#faf0dc" stroke="#b69b5a" stroke-width="2"/>
  <rect x="310" y="244" width="160" height="160" fill="#efebf6" stroke="#9c8bb9" stroke-width="2"/>
  <g text-anchor="middle">
    <g font-size="23" font-weight="700">
      <text x="230" y="155">block (0,0)</text><text x="390" y="155" fill="#245e80">block (1,0)</text>
      <text x="230" y="315">block (0,1)</text><text x="390" y="315">block (1,1)</text>
    </g>
    <g font-size="21" fill="#566a63">
      <text x="230" y="188">16×16 输出</text><text x="390" y="188">16×16 输出</text>
      <text x="230" y="348">16×16 输出</text><text x="390" y="348">16×16 输出</text>
    </g>
    <text x="310" y="433" font-size="17" fill="#566a63">括号中的编号为 (blockIdx.x, blockIdx.y)</text>
  </g>
  <path d="M480 164 H548" fill="none" stroke="#39799b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="570" y="36" font-size="26" font-weight="700">grid(2,2)：四块覆盖整个 C</text>
  <rect x="566" y="72" width="630" height="198" rx="10" fill="#f3f8fc" stroke="#b4cbd9" stroke-width="1.5"/>
  <text x="590" y="108" font-size="23" font-weight="700" fill="#245e80">放大右上块：block (1,0)</text>
  <text x="590" y="145" font-size="21">T=16：16×16 个线程，每线程计算一个输出</text>
  <g font-family="Consolas, monospace" font-size="22">
    <text x="590" y="184">row = 0 × 16 + threadIdx.y</text>
    <text x="590" y="219">col = 1 × 16 + threadIdx.x</text>
  </g>
  <text x="590" y="251" font-size="19" fill="#566a63">threadIdx.x、threadIdx.y 的范围都是 0–15</text>
  <text x="570" y="316" font-size="24" font-weight="700">每个 block 都遍历完整的 K 维度</text>
  <text x="570" y="355" font-size="22">各块把最终结果写入 C 的对应位置</text>
  <text x="570" y="394" font-size="22">4 块 × 256 个输出 = 1024 个输出</text>
</g>
</svg>
