<text x="562" y="263" font-size="23" fill="#246B96" text-anchor="middle" font-weight="400">输出之间共享的输入窗口</text>
<text x="993" y="263" font-size="22" fill="#936015" text-anchor="middle" font-weight="400">右 halo</text>
<line x1="560" y1="282" x2="560" y2="325" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="218" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="257.0" y="379.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">8</text>
<rect x="304" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
