<text x="774.0" y="203.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">14</text>
<rect x="821" y="164" width="78" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="860.0" y="203.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">15</text>
<rect x="907" y="164" width="78" height="62" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
