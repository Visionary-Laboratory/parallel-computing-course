<rect x="391" y="164" width="78" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="430.0" y="203.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">10</text>
<rect x="477" y="164" width="78" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="516.0" y="203.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">11</text>
<rect x="563" y="164" width="78" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="602.0" y="203.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">12</text>
<rect x="649" y="164" width="78" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="688.0" y="203.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">13</text>
