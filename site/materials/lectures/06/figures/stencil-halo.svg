<rect x="476" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="515.0" y="379.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">11</text>
<rect x="562" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="601.0" y="379.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">12</text>
<rect x="648" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="687.0" y="379.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">13</text>
<rect x="734" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="773.0" y="379.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">14</text>
<rect x="820" y="340" width="78" height="62" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="859.0" y="379.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">15</text>
<text x="561" y="459" font-size="24" fill="#20372F" text-anchor="middle" font-weight="700">每个输出读连续 5 项；相邻窗口复用 4 项。</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">若窗口超出全局数组，按本例契约补零；分母始终为 5。</text>
</g></svg>
