<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">流水线建立在独立缓冲区和明确依赖上</title><desc id="desc">流水线建立在独立缓冲区和明确依赖上。三个不同 chunk；蓝色 H2D，绿色 kernel，橙色 D2H；仅为允许重叠时的调度示意。</desc>
