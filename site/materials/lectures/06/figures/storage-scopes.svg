<rect x="605" y="177" width="212" height="63" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="711.0" y="215.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">Thread 0 寄存器</text>
<rect x="839" y="177" width="212" height="63" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
