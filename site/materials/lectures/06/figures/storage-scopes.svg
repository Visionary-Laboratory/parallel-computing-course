<line x1="828" y1="363" x2="828" y2="404" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">Local 指线程私有的地址空间，不代表片上；global 访问也可能命中 L1 / L2。</text>
</g></svg>
