<text x="173.0" y="215.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">Thread 0 寄存器</text>
<rect x="301" y="177" width="212" height="63" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="407.0" y="215.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">Thread 1 寄存器</text>
<rect x="67" y="279" width="446" height="57" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="290.0" y="314.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">Shared memory：本 block 协作</text>
