<line x1="945" y1="244" x2="945" y2="274" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="66" y="409" width="988" height="55" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="560.0" y="444.66" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">Global / Local 地址空间 → 缓存层次 → 显存</text>
