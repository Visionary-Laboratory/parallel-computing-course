<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">复制一个指针数值，没有复制它指向的数据</title><desc id="desc">复制一个指针数值，没有复制它指向的数据。本图采用普通主机堆内存与显式 cudaMalloc 显存；不假定 mapped / managed memory。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">复制一个指针数值，没有复制它指向的数据</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">本图采用普通主机堆内存与显式 cudaMalloc 显存；不假定 mapped / managed memory。</text>
<rect x="45" y="126" width="490" height="345" rx="8" fill="#EDF1F3" stroke="#CFDCD5" stroke-width="1.5"/>
<rect x="585" y="126" width="490" height="345" rx="8" fill="#EDF1F3" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="69" y="163" font-size="25" fill="#20372F" text-anchor="start" font-weight="700">Host</text>
<text x="609" y="163" font-size="25" fill="#20372F" text-anchor="start" font-weight="700">Device</text>
<rect x="74" y="199" width="250" height="68" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="199.0" y="240.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">view.data = h_x</text>
<rect x="74" y="365" width="250" height="63" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="199.0" y="404.32" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">主机数组 h_x</text>
<line x1="198" y1="273" x2="198" y2="357" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="614" y="199" width="428" height="68" rx="8" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="828.0" y="240.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">浅复制后：仍是 h_x 地址</text>
<line x1="332" y1="234" x2="606" y2="234" stroke="#B74836" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="828" y="322" font-size="22" fill="#176B52" text-anchor="middle" font-weight="700">正确 view.data = d_x</text>
<line x1="828" y1="330" x2="828" y2="358" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="614" y="365" width="428" height="63" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="828.0" y="404.32" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">显存数组 d_x</text>
<line x1="332" y1="397" x2="606" y2="397" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="473" y="374" font-size="20" fill="#246B96" text-anchor="middle" font-weight="400">先复制数据</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">先分配并填充 d_x，再构造指向它的设备视图；外壳、数据及其生命周期分别管理。</text>
</g></svg>
