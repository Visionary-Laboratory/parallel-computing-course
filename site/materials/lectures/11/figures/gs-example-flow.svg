<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">同一组高斯：从覆盖关系到像素颜色</title><desc id="desc">G0 红色深度1覆盖 tile0和1，G1 蓝色深度2覆盖 tile1，G2 绿色深度3覆盖 tile1和3。计数为2、1、2，Scan起点0、2、3，共5条记录。排序后 tile0为G0，tile1为G0、G1、G2，tile2为空，tile3为G2。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">同一组高斯：从覆盖关系到像素颜色</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">投影之后，先按高斯收集覆盖关系，再整理成每个 tile 的深度有序列表。</text>
<rect x="45" y="114" width="275" height="42" rx="8" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="182.5" y="142.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">G0 红：tile 0、1</text>
<rect x="45" y="168" width="275" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="182.5" y="196.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">G1 蓝：tile 1</text>
<rect x="45" y="222" width="275" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="182.5" y="250.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">G2 绿：tile 1、3</text>
<line x1="332" y1="190" x2="380" y2="190" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="392" y="114" width="290" height="150" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="537.0" y="151.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">计数 [2, 1, 2]</text>
<text x="537.0" y="181.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">Scan 起点 [0, 2, 3]</text>
<text x="537.0" y="211.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">填写 5 条记录</text>
<text x="537.0" y="241.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">按 tile、深度排序</text>
<line x1="694" y1="190" x2="742" y2="190" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="754" y="114" width="155" height="68" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="831.5" y="139.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">tile 0</text>
<text x="831.5" y="169.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">G0</text>
<rect x="927" y="114" width="155" height="68" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="1004.5" y="139.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">tile 1</text>
<text x="1004.5" y="169.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">G0 → G1 → G2</text>
<rect x="754" y="196" width="155" height="68" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="831.5" y="221.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">tile 2</text>
<text x="831.5" y="251.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">空</text>
<rect x="927" y="196" width="155" height="68" rx="8" fill="#FFFFFF" stroke="#176B52" stroke-width="1.5"/>
<text x="1004.5" y="221.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">tile 3</text>
<text x="1004.5" y="251.12" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">G2</text>
<line x1="32" y1="281" x2="1088" y2="281" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="310" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">各像素沿候选顺序合成；示例 tile 1 得到 RGB (0.5, 0.0625, 0.25)，空 tile 显示背景。</text>
</g></svg>
