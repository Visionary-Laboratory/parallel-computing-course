<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">三个高斯生成一张图像：投影、tile、排序与合成</title>
<desc id="desc">固定红蓝绿三个高斯，投影到8乘8屏幕，分为四个tile。五条记录排序后，tile1得到G0、G1、G2。依次合成红蓝与绿色，得到完整图像；默认像素RGB为0.5、0.0625、0.25，剩余透射率0.1875。</desc>
<defs><clipPath id="screen"><rect x="40" y="135" width="208" height="208"/></clipPath></defs>
<rect width="1120" height="560" rx="10" fill="white"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#244738">
<text x="35" y="44" font-size="28" font-weight="700">同一组三维高斯，生成 8×8 图像</text>
<text x="35" y="78" font-size="20" >先投影与建表，按深度排列候选，再由每个像素独立合成颜色。</text>
<text x="40" y="117" font-size="21" font-weight="600">1 · 投影与四个 tile</text>
<text x="310" y="117" font-size="21" font-weight="600">2 · 排序后的列表</text>
<text x="585" y="117" font-size="21" font-weight="600">3 · 加入红、蓝</text>
<text x="855" y="117" font-size="21" font-weight="600">4 · 再加入绿</text>
