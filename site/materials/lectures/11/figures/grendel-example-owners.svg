<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">参数分工与像素分工：同一组 G0、G1、G2</title><desc id="desc">参数GPU0保存G0和G2，GPU1保存G1。左列tile0、2由GPU0渲染，只需要G0；右列tile1、3由GPU1渲染，需要G0、G1、G2。G0与G2的投影记录从GPU0发往GPU1，其他为本地使用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">参数分工与像素分工：同一组 G0、G1、G2</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">前向只交付当前视角的投影记录；高斯参数与优化器状态由所属 GPU 保存。</text>
<rect x="50" y="110" width="420" height="56" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="260.0" y="145.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">参数 GPU0：G0、G2</text>
<rect x="650" y="110" width="420" height="56" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="860.0" y="145.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">参数 GPU1：G1</text>
<line x1="135" y1="172" x2="135" y2="209" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="155" y="197" font-size="18" fill="#176B52" text-anchor="start" font-weight="400">本地 G0</text>
<line x1="973" y1="172" x2="973" y2="209" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="865" y="197" font-size="18" fill="#246B96" text-anchor="start" font-weight="400">本地 G1</text>
<line x1="440" y1="169" x2="676" y2="209" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="555" y="174" font-size="18" fill="#936015" text-anchor="middle" font-weight="400">G0、G2 跨卡</text>
<rect x="50" y="215" width="420" height="53" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="260.0" y="248.3" font-size="20" fill="#20372F" text-anchor="middle" font-weight="600">渲染 GPU0：tile 0、2 → 需要 G0</text>
<rect x="650" y="215" width="420" height="53" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="860.0" y="247.62" font-size="18" fill="#20372F" text-anchor="middle" font-weight="600">渲染 GPU1：tile 1、3 → 需要 G0、G1、G2</text>
<line x1="32" y1="281" x2="1088" y2="281" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="310" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">G2 覆盖右侧两个 tile，但只需向 GPU1 交付一份投影记录，再由接收端建立局部 tile 列表。</text>
</g></svg>
