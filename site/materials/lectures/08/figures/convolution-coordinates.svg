<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">输出位置 p 先映射到输入，再做点积</title><desc id="desc">输出位置 p 先映射到输入，再做点积。H=7、R=3、padding=1、stride=2、dilation=1；域外输入补零。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">输出位置 p 先映射到输入，再做点积</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">H=7、R=3、padding=1、stride=2、dilation=1；域外输入补零。</text>
<rect x="59" y="143" width="99" height="62" rx="8" fill="#EDF1F3" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="108.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">0填充</text>
<rect x="172" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="221.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">0</text>
<rect x="285" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="334.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">1</text>
<rect x="398" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="447.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="511" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="560.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
<rect x="624" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="673.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">4</text>
<rect x="737" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="786.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">5</text>
<rect x="850" y="143" width="99" height="62" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="899.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<rect x="963" y="143" width="99" height="62" rx="8" fill="#EDF1F3" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="1012.5" y="181.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">0填充</text>
<rect x="59" y="237" width="325" height="36" rx="5" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="221" y="262" font-size="20" fill="#20372F" text-anchor="middle" font-weight="400">p=0：-1, 0, 1</text>
<rect x="285" y="283" width="325" height="36" rx="5" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="447" y="308" font-size="20" fill="#20372F" text-anchor="middle" font-weight="400">p=1：1, 2, 3</text>
<rect x="511" y="329" width="325" height="36" rx="5" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="673" y="354" font-size="20" fill="#20372F" text-anchor="middle" font-weight="400">p=2：3, 4, 5</text>
<rect x="737" y="375" width="325" height="36" rx="5" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="899" y="400" font-size="20" fill="#20372F" text-anchor="middle" font-weight="400">p=3：5, 6, 7</text>
<text x="560" y="471" font-size="24" fill="#20372F" text-anchor="middle" font-weight="700">h = p×2 − 1 + r；改变 dilation 会改变 r 的步长。</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">窗口数量为 4；互相关约定不翻转核，二维对行列分别应用相同地址规则。</text>
</g></svg>
