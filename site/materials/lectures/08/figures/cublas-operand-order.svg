<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">让 cuBLAS 计算 Cᵀ = BᵀAᵀ</title><desc id="desc">上排为行主序C=AB：A=[[1,2,3],[4,5,6]]，B=[[1,0,2,0],[0,1,0,2],[1,1,1,1]]，C=[[4,5,5,7],[10,11,14,16]]。下排将相同内存按列主序解释：B转置4×3乘A转置3×2得到C转置4×2。所以第一个矩阵参数传dB，第二个传dA，输出仍为dC。C转置按列写出的顺序4,5,5,7,10,11,14,16正是C的行主序。</desc>
