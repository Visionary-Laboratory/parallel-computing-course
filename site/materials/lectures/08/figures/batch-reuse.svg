<text x="870.5" y="287.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">W</text>
<text x="870.5" y="317.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">K × N</text>
