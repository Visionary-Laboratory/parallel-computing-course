<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">同一组 K×N 权重；M 个输入行共同参与矩阵乘法。</text>
<text x="268" y="142" font-size="26" fill="#20372F" text-anchor="middle" font-weight="700">M = 1</text>
