<text x="557" y="468" font-size="25" fill="#176B52" text-anchor="middle" font-weight="700">FP16 理想流量：I = 2MKN / [2(MK + KN + MN)]</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">小 M 常被权重读取、启动与并行规模限制；更大 batch 的吞吐收益伴随排队延迟和内存成本。</text>
