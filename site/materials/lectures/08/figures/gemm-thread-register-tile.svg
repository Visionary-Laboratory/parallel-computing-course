<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">一个线程：把四个输入留在寄存器中</title><desc id="desc">一个线程中的2×2个独立累加器。列头为b0=5、b1=7，行头为a0=2、a1=3；四格分别是c00加2乘5、c01加2乘7、c10加3乘5、c11加3乘7。同一行复用A输入，同一列复用B输入。这仅是一个k的贡献，继续遍历其余k后才完成输出。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">一个线程：把四个输入留在寄存器中</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">固定一个 k，取 A 两行的 a₀=2、a₁=3，以及 B 两列的 b₀=5、b₁=7。</text>
<rect x="341" y="105" width="330" height="36" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="506.0" y="131.84" font-size="26" fill="#20372F" text-anchor="middle" font-weight="600">b₀ = 5</text>
<rect x="713" y="105" width="330" height="36" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="878.0" y="131.84" font-size="26" fill="#20372F" text-anchor="middle" font-weight="600">b₁ = 7</text>
<rect x="60" y="157" width="196" height="48" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="158.0" y="190.52" font-size="28" fill="#20372F" text-anchor="middle" font-weight="600">a₀ = 2</text>
<rect x="341" y="157" width="330" height="48" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="506.0" y="190.86" font-size="29" fill="#20372F" text-anchor="middle" font-weight="600">c00 += 2 × 5</text>
<rect x="713" y="157" width="330" height="48" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="878.0" y="190.86" font-size="29" fill="#20372F" text-anchor="middle" font-weight="600">c01 += 2 × 7</text>
<line x1="264" y1="181" x2="330" y2="181" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="226" width="196" height="48" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="158.0" y="259.52" font-size="28" fill="#20372F" text-anchor="middle" font-weight="600">a₁ = 3</text>
<rect x="341" y="226" width="330" height="48" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="506.0" y="259.86" font-size="29" fill="#20372F" text-anchor="middle" font-weight="600">c10 += 3 × 5</text>
<rect x="713" y="226" width="330" height="48" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="878.0" y="259.86" font-size="29" fill="#20372F" text-anchor="middle" font-weight="600">c11 += 3 × 7</text>
<line x1="264" y1="250" x2="330" y2="250" stroke="#176B52" stroke-width="2.5" marker-end="url(#arrow)"/>
</g></svg>
