<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
<title id="title">行主序与列主序：先看六个数怎样排队</title><desc id="desc">A为2×3矩阵[[1,2,3],[4,5,6]]。A的行主序序列是1,2,3,4,5,6；同一个A的列主序序列是1,4,2,5,3,6。保持行主序序列不动，改按3×2的列主序解释，读到的是A转置[[1,4],[2,5],[3,6]]。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">行主序与列主序：先看六个数怎样排队</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">内存是一条连续序列；行主序按行排，列主序按列排。</text>
<text x="137" y="142" font-size="24" fill="#20372F" text-anchor="middle" font-weight="700">同一个 A · 2×3</text>
<rect x="52" y="168" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="78.0" y="197.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">1</text>
<rect x="110" y="168" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="136.0" y="197.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="168" y="168" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="194.0" y="197.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
<rect x="52" y="218" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="78.0" y="247.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">4</text>
<rect x="110" y="218" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="136.0" y="247.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">5</text>
<rect x="168" y="218" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="194.0" y="247.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<text x="290" y="151" font-size="25" fill="#20372F" text-anchor="start" font-weight="700">按行存放 A</text>
<text x="290" y="182" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">先第 1 行，再第 2 行</text>
<rect x="586" y="121" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="612.0" y="150.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">1</text>
<rect x="646" y="121" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="672.0" y="150.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="706" y="121" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="732.0" y="150.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
<rect x="766" y="121" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="792.0" y="150.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">4</text>
<rect x="826" y="121" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="852.0" y="150.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">5</text>
<rect x="886" y="121" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="912.0" y="150.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<line x1="586" y1="172" x2="758" y2="172" stroke="#566A63" stroke-width="2"/>
<text x="672.0" y="196" font-size="19" fill="#566A63" text-anchor="middle" font-weight="400">第 1 行</text>
<line x1="766" y1="172" x2="938" y2="172" stroke="#566A63" stroke-width="2"/>
<text x="852.0" y="196" font-size="19" fill="#566A63" text-anchor="middle" font-weight="400">第 2 行</text>
<text x="290" y="253" font-size="25" fill="#20372F" text-anchor="start" font-weight="700">按列存放 A</text>
<text x="290" y="284" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">先第 1 列，再第 2、3 列</text>
<rect x="586" y="223" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="612.0" y="252.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">1</text>
<rect x="646" y="223" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="672.0" y="252.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">4</text>
<rect x="706" y="223" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="732.0" y="252.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="766" y="223" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="792.0" y="252.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">5</text>
<rect x="826" y="223" width="52" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="852.0" y="252.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
<rect x="886" y="223" width="52" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="912.0" y="252.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<line x1="586" y1="274" x2="698" y2="274" stroke="#566A63" stroke-width="2"/>
<text x="642.0" y="298" font-size="19" fill="#566A63" text-anchor="middle" font-weight="400">第 1 列</text>
<line x1="706" y1="274" x2="818" y2="274" stroke="#566A63" stroke-width="2"/>
<text x="762.0" y="298" font-size="19" fill="#566A63" text-anchor="middle" font-weight="400">第 2 列</text>
<line x1="826" y1="274" x2="938" y2="274" stroke="#566A63" stroke-width="2"/>
<text x="882.0" y="298" font-size="19" fill="#566A63" text-anchor="middle" font-weight="400">第 3 列</text>
<line x1="34" y1="320" x2="1086" y2="320" stroke="#CFDCD5" stroke-width="2"/>
<text x="48" y="354" font-size="24" fill="#20372F" text-anchor="start" font-weight="700">现在保留行主序序列，不移动数据</text>
<rect x="48" y="385" width="50" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="73.0" y="414.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">1</text>
<rect x="106" y="385" width="50" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="131.0" y="414.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="164" y="385" width="50" height="42" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="189.0" y="414.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
<rect x="222" y="385" width="50" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="247.0" y="414.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">4</text>
<rect x="280" y="385" width="50" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="305.0" y="414.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">5</text>
<rect x="338" y="385" width="50" height="42" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="363.0" y="414.5" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<line x1="417" y1="406" x2="643" y2="406" stroke="#566A63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530" y="377" font-size="21" fill="#566A63" text-anchor="middle" font-weight="400">改按 3×2 列主序读</text>
<text x="736" y="350" font-size="24" fill="#20372F" text-anchor="middle" font-weight="700">读到 Aᵀ · 3×2</text>
<rect x="680" y="368" width="50" height="37" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="705.0" y="395.0" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">1</text>
<rect x="738" y="368" width="50" height="37" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="763.0" y="395.0" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">4</text>
<rect x="680" y="410" width="50" height="37" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="705.0" y="437.0" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">2</text>
<rect x="738" y="410" width="50" height="37" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="763.0" y="437.0" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">5</text>
<rect x="680" y="452" width="50" height="37" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="705.0" y="479.0" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">3</text>
<rect x="738" y="452" width="50" height="37" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="763.0" y="479.0" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">6</text>
<text x="858" y="393" font-size="22" fill="#20372F" text-anchor="start" font-weight="400">第 1 列：1、2、3</text>
<text x="858" y="429" font-size="22" fill="#20372F" text-anchor="start" font-weight="400">第 2 列：4、5、6</text>
<line x1="32" y1="501" x2="1088" y2="501" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="530" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">A 的行主序存储 = Aᵀ 的列主序存储；同时交换行列数，元素在内存中的位置不变。</text>
</g></svg>
