<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img"><title>双缓冲网格的一轮更新与两个屏障</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#246548"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="35" font-size="25" fill="#254b38" text-anchor="start" font-weight="600">一轮更新：先收齐结果，再统一切换缓冲</text><text x="24" y="118" font-size="17" fill="#254b38" text-anchor="start" font-weight="400">Worker 0</text><rect x="135" y="92" width="230" height="44" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="250.0" y="121.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">读取 old，写 next</text><path d="M367,114 L421,114" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,114 L625,114" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="92" width="280" height="44" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="832.0" y="121.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">读取新的 old</text><text x="24" y="186" font-size="17" fill="#254b38" text-anchor="start" font-weight="400">Worker 1</text><rect x="135" y="160" width="230" height="44" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="250.0" y="189.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">读取 old，写 next</text><path d="M367,182 L421,182" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,182 L625,182" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="160" width="280" height="44" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="832.0" y="189.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">读取新的 old</text><text x="24" y="254" font-size="17" fill="#254b38" text-anchor="start" font-weight="400">Worker 2</text><rect x="135" y="228" width="230" height="44" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="250.0" y="257.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">读取 old，写 next</text><path d="M367,250 L421,250" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,250 L625,250" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="228" width="280" height="44" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="832.0" y="257.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">读取新的 old</text><rect x="425" y="73" width="49" height="224" rx="7" fill="#d3e5fa" stroke="#bad0c2"/><text x="449" y="58" font-size="17" fill="#2d6f99" text-anchor="middle" font-weight="400">屏障 A</text><rect x="632" y="73" width="49" height="224" rx="7" fill="#d3e5fa" stroke="#bad0c2"/><text x="656" y="58" font-size="17" fill="#2d6f99" text-anchor="middle" font-weight="400">屏障 B</text><rect x="491" y="81" width="115" height="66" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="506" y="110" font-size="20" fill="#254b38" text-anchor="start" font-weight="600">Worker 0</text><text x="506" y="138" font-size="16" fill="#526d5d" text-anchor="start" font-weight="400">检查 / swap</text><text x="24" y="330" font-size="20" fill="#254b38" text-anchor="start" font-weight="400">A：next 全部写好，才可检查整张网格是否满足热量平衡。</text><text x="24" y="369" font-size="20" fill="#254b38" text-anchor="start" font-weight="400">B：停止决定与 old / next 交换已发布给所有 worker。</text><text x="24" y="410" font-size="17" fill="#607668" text-anchor="start" font-weight="400">即使每个元素只有一个写者，下一轮仍然可能读到邻居尚未完成的数据。</text></svg>