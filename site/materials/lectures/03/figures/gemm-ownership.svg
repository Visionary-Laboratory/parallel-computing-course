<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" width="1120" height="370" role="img" aria-labelledby="title desc"><title id="title">矩阵乘法：切输出与切求和需要不同的协调</title><desc id="desc">左侧按输出行分工，每个输出唯一写入。右侧对同一个 D[0,0] 沿求和维度拆分，25 与 33 分别保存后归约为 58。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="42" font-size="28" fill="#203c30" font-weight="600" text-anchor="start">同一个 D = A Wᵀ，分工方式决定是否需要合并</text><rect x="28" y="65" width="510" height="275" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><rect x="582" y="65" width="510" height="275" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="48" y="102" font-size="26" fill="#27704f" font-weight="600" text-anchor="start">① 按输出行分工</text><text x="48" y="137" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">A、W 共同只读；D 每格只有一位写者</text><text x="55" y="198" font-size="22" fill="#236c9b" font-weight="400" text-anchor="start">worker 0</text><text x="55" y="261" font-size="22" fill="#a35c1f" font-weight="400" text-anchor="start">worker 1</text><rect x="228" y="163" width="117" height="50" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="286" y="197" font-size="27" fill="#236c9b" font-weight="600" text-anchor="middle">58</text><rect x="363" y="163" width="117" height="50" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="421" y="197" font-size="27" fill="#236c9b" font-weight="600" text-anchor="middle">64</text><rect x="228" y="226" width="117" height="50" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="286" y="260" font-size="27" fill="#a35c1f" font-weight="600" text-anchor="middle">139</text><rect x="363" y="226" width="117" height="50" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="421" y="260" font-size="27" fill="#a35c1f" font-weight="600" text-anchor="middle">154</text><text x="48" y="315" font-size="23" fill="#27704f" font-weight="600" text-anchor="start">写完整结果，不需要跨 worker 合并</text><text x="602" y="102" font-size="26" fill="#a35c1f" font-weight="600" text-anchor="start">② 拆开同一个输出的求和</text><text x="602" y="137" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">D[0,0] = 1×7 + 2×9 + 3×11</text><rect x="614" y="157" width="208" height="62" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="718" y="184" font-size="22" fill="#a35c1f" font-weight="400" text-anchor="middle">1×7 + 2×9</text><text x="718" y="210" font-size="22" fill="#a35c1f" font-weight="600" text-anchor="middle">部分和 25</text><path d="M718,221 L841,255" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="862" y="157" width="208" height="62" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="966" y="184" font-size="22" fill="#a35c1f" font-weight="400" text-anchor="middle">3×11</text><text x="966" y="210" font-size="22" fill="#a35c1f" font-weight="600" text-anchor="middle">部分和 33</text><path d="M966,221 L841,255" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="727" y="257" width="228" height="40" rx="10" fill="#edf5ef" stroke="#bdcfc4"/><text x="841" y="285" font-size="25" fill="#27704f" font-weight="600" text-anchor="middle">25 + 33 = 58</text><text x="602" y="326" font-size="23" fill="#27704f" font-weight="600" text-anchor="start">先各写临时位置，再归约</text></svg>