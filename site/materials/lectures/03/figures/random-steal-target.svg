<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 407" width="1120" height="407" role="img" aria-labelledby="title desc"><title id="title">随机选择窃取目标：分散尝试，而非保证每次最优</title><desc id="desc">六个worker中W0、W1、W2分别还有8、6、4项待领任务，W3、W4、W5空闲。左侧三人按相同排名都尝试W0，可能争用其队列。右侧展示一次随机分别选择W0、W1、W2的结果，仅为可能的抽样，并不保证每次分散或成功。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="40" font-size="29" fill="#203c30" font-weight="600" text-anchor="start">随机选的是“去谁的队列试一次”</text><text x="28" y="77" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">W3、W4、W5 同时空闲；W0、W1、W2 还有待领任务。</text><rect x="28" y="93" width="510" height="276" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="46" y="122" font-size="24" fill="#a35c1f" font-weight="600" text-anchor="start">都按相同排名选择 W0</text><rect x="46" y="145" width="150" height="68" rx="10" fill="#fff" stroke="#bdcfc4"/><text x="121" y="171" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">W0 的队列</text><text x="121" y="201" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">待领 8 项</text><rect x="46" y="278" width="150" height="43" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="121" y="307" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">空闲 W3</text><path d="M121,274 L121,217" stroke="#a35c1f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="207" y="145" width="150" height="68" rx="10" fill="#fff" stroke="#bdcfc4"/><text x="282" y="171" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">W1 的队列</text><text x="282" y="201" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">待领 6 项</text><rect x="207" y="278" width="150" height="43" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="282" y="307" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">空闲 W4</text><path d="M282,274 L121,217" stroke="#a35c1f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="368" y="145" width="150" height="68" rx="10" fill="#fff" stroke="#bdcfc4"/><text x="443" y="171" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">W2 的队列</text><text x="443" y="201" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">待领 4 项</text><rect x="368" y="278" width="150" height="43" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="443" y="307" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">空闲 W5</text><path d="M443,274 L121,217" stroke="#a35c1f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="46" y="352" font-size="21" fill="#a35c1f" font-weight="400" text-anchor="start">选择相同目标，可能争用同一个队列</text><rect x="582" y="93" width="510" height="276" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="600" y="122" font-size="24" fill="#27704f" font-weight="600" text-anchor="start">各自随机选择：一种可能结果</text><rect x="600" y="145" width="150" height="68" rx="10" fill="#fff" stroke="#bdcfc4"/><text x="675" y="171" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">W0 的队列</text><text x="675" y="201" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">待领 8 项</text><rect x="600" y="278" width="150" height="43" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="675" y="307" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">空闲 W3</text><path d="M675,274 L675,217" stroke="#27704f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="761" y="145" width="150" height="68" rx="10" fill="#fff" stroke="#bdcfc4"/><text x="836" y="171" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">W1 的队列</text><text x="836" y="201" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">待领 6 项</text><rect x="761" y="278" width="150" height="43" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="836" y="307" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">空闲 W4</text><path d="M836,274 L836,217" stroke="#27704f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="922" y="145" width="150" height="68" rx="10" fill="#fff" stroke="#bdcfc4"/><text x="997" y="171" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">W2 的队列</text><text x="997" y="201" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">待领 4 项</text><rect x="922" y="278" width="150" height="43" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="997" y="307" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">空闲 W5</text><path d="M997,274 L997,217" stroke="#27704f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="352" font-size="21" fill="#27704f" font-weight="400" text-anchor="start">这一次分散了，但随机仍可能碰撞</text><text x="28" y="397" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">图只展示窃取尝试；取走任务仍需同步，失败后再尝试其他目标。</text></svg>