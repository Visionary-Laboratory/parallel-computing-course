<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">分配方式不同，跨 worker 的边界也不同</title><desc id="desc">分配方式不同，跨 worker 的边界也不同。8 行数据交给 4 个 worker；每行读取相邻行，颜色与 T 编号一起表示所有权</desc>
