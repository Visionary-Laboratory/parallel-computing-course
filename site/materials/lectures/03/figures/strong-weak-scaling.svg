<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-labelledby="title desc"><title id="title">强扩展与弱扩展：增加人数时，什么保持不变</title><desc id="desc">每个小方格代表一位worker负责的区域。强扩展保持64×64总网格，16人变64人，每区16×16变8×8。弱扩展保持每区16×16，16人变64人，总网格64×64变128×128。图中网格使用同一空间比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><rect x="20" y="12" width="520" height="404" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="40" y="47" font-size="25" fill="#236c9b" font-weight="600" text-anchor="start">强扩展：同一个问题，更快算完</text><text x="40" y="79" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">总网格不变；每人负责的区域缩小</text><rect x="580" y="12" width="520" height="404" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="600" y="47" font-size="25" fill="#27704f" font-weight="600" text-anchor="start">弱扩展：相近时间，算更大问题</text><text x="600" y="79" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">每人区域不变；总网格扩大</text><rect x="48" y="154" width="112" height="112" rx="0" fill="#edf5ef" stroke="#236c9b"/><path d="M76.0,154 L76.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,182.0 L160,182.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M104.0,154 L104.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,210.0 L160,210.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M132.0,154 L132.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,238.0 L160,238.0" stroke="#236c9b" stroke-width="2" fill="none"/><rect x="48" y="154" width="28.0" height="28.0" rx="0" fill="#f5cd93" stroke="#a35c1f"/><rect x="330" y="154" width="112" height="112" rx="0" fill="#edf5ef" stroke="#236c9b"/><path d="M344.0,154 L344.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,168.0 L442,168.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M358.0,154 L358.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,182.0 L442,182.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M372.0,154 L372.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,196.0 L442,196.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M386.0,154 L386.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,210.0 L442,210.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M400.0,154 L400.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,224.0 L442,224.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M414.0,154 L414.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,238.0 L442,238.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M428.0,154 L428.0,266" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M330,252.0 L442,252.0" stroke="#236c9b" stroke-width="2" fill="none"/><rect x="330" y="154" width="14.0" height="14.0" rx="0" fill="#f5cd93" stroke="#a35c1f"/><rect x="608" y="154" width="112" height="112" rx="0" fill="#edf5ef" stroke="#27704f"/><path d="M636.0,154 L636.0,266" stroke="#27704f" stroke-width="2" fill="none"/><path d="M608,182.0 L720,182.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M664.0,154 L664.0,266" stroke="#27704f" stroke-width="2" fill="none"/><path d="M608,210.0 L720,210.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M692.0,154 L692.0,266" stroke="#27704f" stroke-width="2" fill="none"/><path d="M608,238.0 L720,238.0" stroke="#27704f" stroke-width="2" fill="none"/><rect x="608" y="154" width="28.0" height="28.0" rx="0" fill="#f5cd93" stroke="#a35c1f"/><rect x="842" y="98" width="224" height="224" rx="0" fill="#edf5ef" stroke="#27704f"/><path d="M870.0,98 L870.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,126.0 L1066,126.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M898.0,98 L898.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,154.0 L1066,154.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M926.0,98 L926.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,182.0 L1066,182.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M954.0,98 L954.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,210.0 L1066,210.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M982.0,98 L982.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,238.0 L1066,238.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M1010.0,98 L1010.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,266.0 L1066,266.0" stroke="#27704f" stroke-width="2" fill="none"/><path d="M1038.0,98 L1038.0,322" stroke="#27704f" stroke-width="2" fill="none"/><path d="M842,294.0 L1066,294.0" stroke="#27704f" stroke-width="2" fill="none"/><rect x="842" y="98" width="28.0" height="28.0" rx="0" fill="#f5cd93" stroke="#a35c1f"/><path d="M185,210 L303,210" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="244" y="192" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">人数 ×4</text><path d="M737,210 L823,210" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="780" y="192" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">×4</text><text x="104" y="349" font-size="21" fill="#203c30" font-weight="600" text-anchor="middle">64×64 总网格</text><text x="104" y="374" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">16 人</text><text x="104" y="400" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">每区 16×16</text><text x="386" y="349" font-size="21" fill="#203c30" font-weight="600" text-anchor="middle">64×64 总网格</text><text x="386" y="374" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">64 人</text><text x="386" y="400" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">每区 8×8</text><text x="664" y="349" font-size="21" fill="#203c30" font-weight="600" text-anchor="middle">64×64 总网格</text><text x="664" y="374" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">16 人</text><text x="664" y="400" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">每区 16×16</text><text x="954" y="349" font-size="21" fill="#203c30" font-weight="600" text-anchor="middle">128×128 总网格</text><text x="954" y="374" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">64 人</text><text x="954" y="400" font-size="21" fill="#203c30" font-weight="400" text-anchor="middle">每区 16×16</text><text x="560" y="460" font-size="20" fill="#203c30" font-weight="400" text-anchor="middle">同一绘图比例；每个小方格是一个分区，橙色标出其中一个（不是一个温度点）。</text></svg>