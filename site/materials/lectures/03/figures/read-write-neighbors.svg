<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" width="1120" height="570" role="img" aria-labelledby="title desc"><title id="title">相邻温度点：写不同格子，仍要确定读值版本</title><desc id="desc">金属板左边界100°C，其余三边0°C。只更新A=(1,1)、B=(1,2)，其余内点保持0。A先得到25，B随后得到6.25；B先得到0，A随后得到25。双缓冲固定读取旧值，A=25、B=0。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="43" font-size="29" fill="#203c30" font-weight="600" text-anchor="start">同一格温度：A 要写，B 要读</text><text x="28" y="80" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">只演示 A、B 两个任务；边界不动，其余内点保持 0。每次取四邻平均。</text><text x="77.5" y="118" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="37" y="161" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="56" y="132" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="76.0" y="159" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="99" y="132" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="119.0" y="159" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="142" y="132" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="162.0" y="159" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="185" y="132" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="205.0" y="159" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="228" y="132" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="248.0" y="159" font-size="18" fill="#203c30" font-weight="400" text-anchor="middl