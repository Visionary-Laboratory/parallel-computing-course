-anchor="middle">0</text><rect x="142" y="347" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="162.0" y="374" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="185" y="347" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="205.0" y="374" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="228" y="347" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="248.0" y="374" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="271" y="347" width="40" height="40" rx="4" fill="#f0f3f1" stroke="#d5e0d9"/><text x="291.0" y="374" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="56" y="418" font-size="22" fill="#203c30" font-weight="600" text-anchor="start">A：(1,1)　B：(1,2)</text><rect x="361" y="112" width="731" height="142" rx="10" fill="#fff7ed" stroke="#bdcfc4"/><text x="381" y="145" font-size="24" fill="#a35c1f" font-weight="600" text-anchor="start">顺序一：A 算完，B 再读</text><text x="389" y="191" font-size="27" fill="#a35c1f" font-weight="600" text-anchor="start">A：0 → 25</text><path d="M651,182 L723,182" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="744" y="191" font-size="27" fill="#a35c1f" font-weight="600" text-anchor="start">B：0 → 6.25</text><text x="381" y="230" font-size="21" fill="#203c30" font-weight="400" text-anchor="start">B 读取 A 的新值 25：(25+0+0+0)/4 = 6.25</text><rect x="361" y="270" width="731" height="142" rx="10" fill="#f0f6fb" stroke="#bdcfc4"/><text x="381" y="303" font-size="24" fill="#236c9b" font-weight="600" text-anchor="start">顺序二：B 算完，A 再读</text><text x="389" y="349" font-size="27" fill="#236c9b" font-weight="600" text-anchor="start">B：0 → 0</text><path d="M651,340 L723,340" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="744" y="349" font-size="27" fill="#236c9b" font-weight="600" text-anchor="start">A：0 → 25</text><text x="381" y="388" font-size="21" fill="#203c30" font-weight="400" text-anchor="start">B 读取 A 的旧值 0；A 从左边界得到 100/4 = 25</text><rect x="28" y="451" width="1064" height="91" rx="10" fill="#edf5ef" stroke="#bdcfc4"/><text x="48" y="486" font-size="25" fill="#27704f" font-weight="600" text-anchor="start">双缓冲：本轮只读 old，A 对应的旧估计一直是 0°C</text><text x="48" y="523" font-size="24" fill="#27704f" font-weight="400" text-anchor="start">A 写 next[1,1]=25；B 写 next[1,2]=0；谁先完成都不会覆盖对方的输入。</text></svg>