<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" role="img" aria-labelledby="title desc"><title id="title">双缓冲连续两轮的数据生命周期</title><desc id="desc">第1轮读 A 中的 u0、写 B 中的 u1；等全部读取写入完成并交换角色后，第2轮读 B 中的 u1、把 A 覆盖为 u2。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="40" font-size="28" fill="#203c30" font-weight="600" text-anchor="start">角色会交换，真实存储始终只有 A 与 B</text><text x="342" y="87" font-size="25" fill="#203c30" font-weight="600" text-anchor="middle">第 1 轮</text><text x="875" y="87" font-size="25" fill="#203c30" font-weight="600" text-anchor="middle">第 2 轮</text><text x="28" y="168" font-size="25" fill="#203c30" font-weight="600" text-anchor="start">物理 A</text><text x="28" y="253" font-size="25" fill="#203c30" font-weight="600" text-anchor="start">物理 B</text><rect x="166" y="117" width="352" height="65" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="342.0" y="159" font-size="27" fill="#236c9b" font-weight="600" text-anchor="middle">读取 u⁰ · old</text><rect x="166" y="204" width="352" height="65" rx="10" fill="#edf5ef" stroke="#bdcfc4"/><text x="342.0" y="246" font-size="27" fill="#27704f" font-weight="600" text-anchor="middle">写入 u¹ · next</text><rect x="699" y="117" width="352" height="65" rx="10" fill="#edf5ef" stroke="#bdcfc4"/><text x="875.0" y="159" font-size="27" fill="#27704f" font-weight="600" text-anchor="middle">覆盖为 u² · next</text><rect x="699" y="204" width="352" height="65" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="875.0" y="246" font-size="27" fill="#236c9b" font-weight="600" text-anchor="middle">读取 u¹ · old</text><rect x="548" y="109" width="122" height="166" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="609" y="145" font-size="22" fill="#a35c1f" font-weight="600" text-anchor="middle">全部读完</text><text x="609" y="178" font-size="22" fill="#a35c1f" font-weight="600" text-anchor="middle">全部写完</text><text x="609" y="226" font-size="22" fill="#a35c1f" font-weight="600" text-anchor="middle">交换角色</text><path d="M520,150 L543,150" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M672,150 L694,150" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M520,237 L543,237" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M672,237 L694,237" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="28" y="318" font-size="25" fill="#a35c1f" font-weight="600" text-anchor="start">只有旧读者全部结束，A 才能安全地从 u⁰ 改写为 u²。</text></svg>