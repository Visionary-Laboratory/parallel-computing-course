<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 486" width="1120" height="486" role="img" aria-labelledby="title desc"><title id="title">从一个温度点的平衡差，到整块金属板的验收</title><desc id="desc">雅可比第一轮完成后，C=(2,1)为25°C，上下邻点各25°C，左邻边界100°C，右邻0°C。四邻平均37.5°C，与C相差12.5°C。对全部16个内点计算同样的绝对差，最大值12.5°C，大于0.01°C，需继续迭代。检查只读取这一轮完成后的温度表，不更新温度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="43" font-size="29" fill="#203c30" font-weight="600" text-anchor="start">这一轮算完了，温度表满足平衡了吗？</text><text x="28" y="79" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">接回第4页：雅可比第1轮完成后，固定这份温度表，再做检查。</text><rect x="28" y="102" width="330" height="330" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="44" y="138" font-size="25" fill="#236c9b" font-weight="600" text-anchor="start">① 看 C 点与四邻</text><path d="M196,221 L196,233" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M140,262 L147,262" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M245,262 L251,262" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M196,291 L196,301" stroke="#236c9b" stroke-width="2" fill="none"/><rect x="151" y="169" width="90" height="50" rx="7" fill="#fff" stroke="#bdcfc4"/><text x="196" y="202" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">上：25</text><rect x="47" y="237" width="90" height="50" rx="7" fill="#fff" stroke="#bdcfc4"/><text x="92" y="270" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">左：100</text><rect x="151" y="237" width="90" height="50" rx="7" fill="#e9f2fa" stroke="#236c9b"/><text x="196" y="270" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">C：25</text><rect x="255" y="237" width="90" height="50" rx="7" fill="#fff" stroke="#bdcfc4"/><text x="300" y="270" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">右：0</text><rect x="151" y="305" width="90" height="50" rx="7" fill="#fff" stroke="#bdcfc4"/><text x="196" y="338" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">下：25</text><text x="48" y="394" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">C = (2,1)；温度单位：°C</text><rect x="380" y="102" width="335" height="330" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="398" y="138" font-size="25" fill="#a35c1f" font-weight="600" text-anchor="start">② 算这个点的平衡差</text><text x="398" y="181" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">四邻平均</text><text x="398" y="218" font-size="25" fill="#203c30" font-weight="400" text-anchor="start">(25 + 25 + 100 + 0) ÷ 4</text><text x="398" y="259" font-size="31" fill="#27704f" font-weight="600" text-anchor="start">= 37.5°C</text><rect x="393" y="279" width="309" height="90" rx="10" fill="#fff1e0" stroke="#e0bd97"/><text x="406" y="312" font-size="22" fill="#a35c1f" font-weight="400" text-anchor="start">平衡差 = |中心 − 四邻平均|</text><text x="406" y="350" font-size="26" fill="#a35c1f" font-weight="600" text-anchor="start">|25 − 37.5| = 12.5°C</text><text x="398" y="405" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">只检查，此时不改写 C。</text><rect x="737" y="102" width="355" height="330" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="755" y="138" font-size="24" fill="#203c30" font-weight="600" text-anchor="start">③ 全板计算，再取最大值</text><rect x="774" y="162" width="68" height="33" rx="5" fill="#fff" stroke="#bdcfc4"/><text x="808" y="187" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">6.25</text><rect x="846" y="162" width="68" height="33" rx="5" fill="#fff" stroke="#bdcfc4"/><text x="880" y="187" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">6.25</text><rect x="918" y="162" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="952" y="187" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="990" y="162" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="1024" y="187" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="774" y="199" width="68" height="33" rx="5" fill="#fff1e0" stroke="#236c9b"/><text x="808" y="224" font-size="23" fill="#a35c1f" font-weight="600" text-anchor="middle">12.5</text><rect x="846" y="199" width="68" height="33" rx="5" fill="#fff" stroke="#bdcfc4"/><text x="880" y="224" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">6.25</text><rect x="918" y="199" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="952" y="224" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="990" y="199" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="1024" y="224" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="774" y="236" width="68" height="33" rx="5" fill="#fff1e0" stroke="#bdcfc4"/><text x="808" y="261" font-size="23" fill="#a35c1f" font-weight="600" text-anchor="middle">12.5</text><rect x="846" y="236" width="68" height="33" rx="5" fill="#fff" stroke="#bdcfc4"/><text x="880" y="261" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">6.25</text><rect x="918" y="236" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="952" y="261" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="990" y="236" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="1024" y="261" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="774" y="273" width="68" height="33" rx="5" fill="#fff" stroke="#bdcfc4"/><text x="808" y="298" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">6.25</text><rect x="846" y="273" width="68" height="33" rx="5" fill="#fff" stroke="#bdcfc4"/><text x="880" y="298" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">6.25</text><rect x="918" y="273" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="952" y="298" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="990" y="273" width="68" height="33" rx="5" fill="#edf5ef" stroke="#bdcfc4"/><text x="1024" y="298" font-size="23" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="749" y="224" font-size="21" fill="#236c9b" font-weight="600" text-anchor="start">C</text><text x="755" y="338" font-size="26" fill="#a35c1f" font-weight="600" text-anchor="start">最大平衡差 = 12.5°C</text><text x="755" y="374" font-size="24" fill="#27704f" font-weight="600" text-anchor="start">12.5 &gt; 0.01 → 继续迭代</text><text x="755" y="412" font-size="22" fill="#203c30" font-weight="400" text-anchor="start">格内是差值，不是温度。</text><text x="28" y="470" font-size="23" fill="#203c30" font-weight="600" text-anchor="start">同一张温度表 → 逐点计算绝对差 → 全板取最大值（单位：°C）</text></svg>