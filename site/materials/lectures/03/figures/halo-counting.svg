<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 385" width="1120" height="385" role="img" aria-labelledby="title desc"><title id="title">64乘64网格的接口、消息和字节</title><desc id="desc">16横条有15个内部接口，每接口长64。4乘4方块有24个内部接口，每接口长16。每个接口双向发送，所以为30条7680字节与48条3072字节。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="40" font-size="28" fill="#203c30" font-weight="600" text-anchor="start">始终比较同一块 64×64 网格、同样 16 个分区</text><rect x="28" y="61" width="510" height="299" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="48" y="99" font-size="26" fill="#203c30" font-weight="600" text-anchor="start">横条：16×1</text><rect x="582" y="61" width="510" height="299" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="602" y="99" font-size="26" fill="#203c30" font-weight="600" text-anchor="start">方块：4×4</text><rect x="48" y="128" width="192" height="192" rx="0" fill="#edf5ef" stroke="#bdcfc4"/><path d="M48,140.0 L240,140.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,152.0 L240,152.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,164.0 L240,164.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,176.0 L240,176.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,188.0 L240,188.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,200.0 L240,200.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,212.0 L240,212.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,224.0 L240,224.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,236.0 L240,236.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,248.0 L240,248.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,260.0 L240,260.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,272.0 L240,272.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,284.0 L240,284.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,296.0 L240,296.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M48,308.0 L240,308.0" stroke="#236c9b" stroke-width="2" fill="none"/><rect x="602" y="128" width="192" height="192" rx="0" fill="#edf5ef" stroke="#bdcfc4"/><path d="M602,176.0 L794,176.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M602,224.0 L794,224.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M602,272.0 L794,272.0" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M650.0,128 L650.0,320" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M698.0,128 L698.0,320" stroke="#236c9b" stroke-width="2" fill="none"/><path d="M746.0,128 L746.0,320" stroke="#236c9b" stroke-width="2" fill="none"/><text x="262" y="149" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">15 个接口</text><text x="262" y="191" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">每接口 64 个值</text><text x="262" y="233" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">双向 → 30 条消息</text><text x="262" y="275" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">30×64×4</text><text x="262" y="317" font-size="23" fill="#27704f" font-weight="600" text-anchor="start">7680 B</text><text x="816" y="149" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">3×4 + 4×3</text><text x="816" y="191" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">24 个接口</text><text x="816" y="233" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">双向 → 48 条消息</text><text x="816" y="275" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">48×16×4</text><text x="816" y="317" font-size="23" fill="#27704f" font-weight="600" text-anchor="start">3072 B</text><text x="28" y="382" font-size="21" fill="#236c9b" font-weight="400" text-anchor="start">蓝线：内部分界；每对相邻分区各发一份数据。物理外边界不计发送。</text></svg>