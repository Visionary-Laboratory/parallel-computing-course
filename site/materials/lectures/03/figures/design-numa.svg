<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">NUMA：地址空间共享，数据距离并不相同</title><desc id="desc">NUMA：地址空间共享，数据距离并不相同。同一个地址 X，访问代价取决于它所在的内存节点与发起请求的核心</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">NUMA：地址空间共享，数据距离并不相同</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">同一个地址 X，访问代价取决于它所在的内存节点与发起请求的核心</text>
<rect x="57" y="126" width="420" height="337" rx="8" fill="#FFFFFF" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="85" y="166" font-size="25" fill="#20372F" text-anchor="start" font-weight="600">NUMA 节点 0</text>
<rect x="86" y="191" width="360" height="73" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="266.0" y="235.66" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">本地核心 · T0</text>
<rect x="86" y="359" width="360" height="73" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="266.0" y="403.66" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">内存 0：数组 X</text>
<line x1="160" y1="269" x2="160" y2="350" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="181" y="317" font-size="22" fill="#246B96" text-anchor="start" font-weight="400">本地路径</text>
<rect x="627" y="126" width="420" height="337" rx="8" fill="#FFFFFF" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="655" y="166" font-size="25" fill="#20372F" text-anchor="start" font-weight="600">NUMA 节点 1</text>
<rect x="656" y="191" width="360" height="73" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="836.0" y="235.66" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">本地核心 · T1</text>
<rect x="656" y="359" width="360" height="73" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="836.0" y="403.66" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">内存 1：数组 Y</text>
<line x1="730" y1="269" x2="730" y2="350" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="751" y="317" font-size="22" fill="#246B96" text-anchor="start" font-weight="400">本地路径</text>
<path d="M 838 264 V 295 H 1067 V 483 H 367 V 440" fill="none" stroke="#B74836" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="654" y="473" font-size="22" fill="#B74836" text-anchor="middle" font-weight="400">T1 访问 X：经过节点互连</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">远程访问多经过互连；具体延迟、带宽和页放置依平台而变。共享地址空间不意味着均匀代价。</text>
</g></svg>
