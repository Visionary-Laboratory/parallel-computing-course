<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" role="img" aria-labelledby="title desc"><title id="title">算左侧的下一轮温度，必须等谁？</title><desc id="desc">同一块6乘6金属板，worker0负责内部第1列，worker1负责第2列，worker2负责第3和4列。雅可比第1轮中前两者完成，worker2未完成。C=(2,1)的第2轮只读第1轮的上25、下25、左边界100、右0，因此在数据安全交接后可得37.5，无需读取第3和4列。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="43" font-size="28" fill="#203c30" font-weight="600" text-anchor="start">同一块金属板：只看 C 的下一次更新要读谁</text><text x="28" y="79" font-size="23" fill="#203c30" font-weight="400" text-anchor="start">第1轮：worker 0、1 已交付结果；worker 2 还在计算。</text><text x="89" y="116" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="132" y="116" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">1</text><text x="175" y="116" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">2</text><text x="218" y="116" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">3</text><text x="261" y="116" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">4</text><text x="304" y="116" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">5</text><text x="51" y="154" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="69" y="126" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="89" y="154" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="112" y="126" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="132" y="154" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="155" 