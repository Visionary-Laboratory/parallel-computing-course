nchor="middle">2</text><rect x="69" y="212" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#236c9b"/><text x="89" y="240" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">100</text><rect x="112" y="212" width="40" height="40" rx="5" fill="#fff1e0" stroke="#a35c1f"/><text x="132" y="240" font-size="22" fill="#a35c1f" font-weight="600" text-anchor="middle">C</text><rect x="155" y="212" width="40" height="40" rx="5" fill="#e9f2fa" stroke="#236c9b"/><text x="175" y="240" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">0</text><rect x="198" y="212" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="218" y="240" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">…</text><rect x="241" y="212" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="261" y="240" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">…</text><rect x="284" y="212" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="304" y="240" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="51" y="283" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">3</text><rect x="69" y="255" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="89" y="283" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">100</text><rect x="112" y="255" width="40" height="40" rx="5" fill="#edf5ef" stroke="#236c9b"/><text x="132" y="283" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">25</text><rect x="155" y="255" width="40" height="40" rx="5" fill="#e9f2fa" stroke="#cdd9d2"/><text x="175" y="283" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="198" y="255" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="218" y="283" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">…</text><rect x="241" y="255" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="261" y="283" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">…</text><rect x="284" y="255" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="304" y="283" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="51" y="326" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">4</text><rect x="69" y="298" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="89" y="326" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">100</text><rect x="112" y="298" width="40" height="40" rx="5" fill="#edf5ef" stroke="#cdd9d2"/><text x="132" y="326" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">25</text><rect x="155" y="298" width="40" height="40" rx="5" fill="#e9f2fa" stroke="#cdd9d2"/><text x="175" y="326" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="198" y="298" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="218" y="326" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">…</text><rect x="241" y="298" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="261" y="326" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">…</text><rect x="284" y="298" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="304" y="326" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="51" y="369" font-size="18" fill="#203c30" font-weight="400" text-anchor="middle">5</text><rect x="69" y="341" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="89" y="369" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="112" y="341" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="132" y="369" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="155" y="341" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="175" y="369" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="198" y="341" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="218" y="369" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="241" y="341" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="261" y="369" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><rect x="284" y="341" width="40" height="40" rx="5" fill="#f0f2f1" stroke="#cdd9d2"/><text x="304" y="369" font-size="22" fill="#203c30" font-weight="400" text-anchor="middle">0</text><text x="132" y="411" font-size="22" fill="#27704f" font-weight="600" text-anchor="middle">0</text><text x="175" y="411" font-size="22" fill="#236c9b" font-weight="600" text-anchor="middle">1</text><text x="239.5" y="411" font-size="22" fill="#203c30" font-weight="600" text-anchor="middle">2</text><text x="28" y="438" font-size="20" fill="#203c30" font-weight="400" text-anchor="start">列下数字为 worker 编号；… 表示尚未交付。</text><rect x="450" y="102" width="642" height="310" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="470" y="142" font-size="26" fill="#203c30" font-weight="600" text-anchor="start">C = (2,1)：它只读取四个邻点</text><text x="470" y="185" font-size="24" fill="#27704f" font-weight="400" text-anchor="start">上 25、下 25：来自 worker 0 的第1轮</text><text x="470" y="226" font-size="24" fill="#236c9b" font-weight="400" text-anchor="start">右 0：来自 worker 1 的第1轮</text><text x="470" y="267" font-size="24" fill="#203c30" font-weight="400" text-anchor="start">左 100：固定边界，不需要 worker 计算</text><rect x="470" y="287" width="602" height="62" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="490" y="328" font-size="25" fill="#a35c1f" font-weight="600" text-anchor="start">第2轮 C = (25 + 25 + 100 + 0) ÷ 4 = 37.5°C</text><text x="470" y="391" font-size="24" fill="#203c30" font-weight="600" text-anchor="start">没有读取第3、4列，所以 C 不必等 worker 2。</text></svg>