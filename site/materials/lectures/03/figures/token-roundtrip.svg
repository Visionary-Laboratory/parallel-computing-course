<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 365" width="1120" height="365" role="img" aria-labelledby="title desc"><title id="title">token5从输入位置5分组到位置7再回到输出位置5</title><desc id="desc">专家2的区间从5开始，token5之前有两个同组token，故位置是5加2等于7。专家处理后的结果用保存的映射放回输出位置5。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#678777" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,monospace}</style><rect width="1120" height="100%" rx="14" fill="#fff"/><text x="28" y="42" font-size="28" fill="#203c30" font-weight="600" text-anchor="start">追踪同一个 token：身份不变，存放位置改变</text><rect x="28" y="80" width="290" height="166" rx="10" fill="#e9f2fa" stroke="#bdcfc4"/><text x="48" y="120" font-size="25" fill="#236c9b" font-weight="600" text-anchor="start">① 原输入</text><text x="173" y="173" font-size="30" fill="#236c9b" font-weight="600" text-anchor="middle">input[5]</text><text x="173" y="218" font-size="22" fill="#236c9b" font-weight="400" text-anchor="middle">token 5 → 专家 2</text><rect x="414" y="80" width="290" height="166" rx="10" fill="#fff1e0" stroke="#bdcfc4"/><text x="434" y="120" font-size="25" fill="#a35c1f" font-weight="600" text-anchor="start">② 专家 2 处理</text><text x="559" y="173" font-size="30" fill="#a35c1f" font-weight="600" text-anchor="middle">grouped[7]</text><text x="559" y="218" font-size="22" fill="#a35c1f" font-weight="400" text-anchor="middle">→ expert_result[7]</text><rect x="800" y="80" width="290" height="166" rx="10" fill="#edf5ef" stroke="#bdcfc4"/><text x="820" y="120" font-size="25" fill="#27704f" font-weight="600" text-anchor="start">③ 恢复原次序</text><text x="945" y="173" font-size="30" fill="#27704f" font-weight="600" text-anchor="middle">out[5]</text><text x="945" y="218" font-size="22" fill="#27704f" font-weight="400" text-anchor="middle">专家处理后的结果</text><path d="M326,168 L403,168" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M712,168 L789,168" stroke="#678777" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="273" width="1062" height="67" rx="10" fill="#f8faf8" stroke="#bdcfc4"/><text x="49" y="315" font-size="25" fill="#203c30" font-weight="600" text-anchor="start">位置 p[5] = 组起点 5 + 组内序号 2 = 7；返回：out[5] = expert_result[7]</text></svg>