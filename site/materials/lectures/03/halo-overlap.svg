<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 1000 456" role="img"><title>Halo 通信与内部网格计算的依赖及重叠</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#246548"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="35" font-size="24" fill="#254b38" text-anchor="start" font-weight="600">能重叠的是独立工作；接口返回不等于通信完成</text><text x="24" y="137" font-size="19" fill="#254b38" text-anchor="start" font-weight="400">串行安排</text><text x="24" y="268" font-size="19" fill="#254b38" text-anchor="start" font-weight="400">重叠安排</text><rect x="150" y="98" width="240" height="54" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="270.0" y="132.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">交换 halo</text><rect x="403" y="98" width="315" height="54" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="560.5" y="132.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">计算内部区域</text><rect x="730" y="98" width="242" height="54" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="851.0" y="132.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">计算边界</text><rect x="150" y="218" width="335" height="50" rx="7" fill="#e0edf8" stroke="#bad0c2"/><text x="317.5" y="250.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">异步交换 halo</text><rect x="150" y="280" width="420" height="50" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="360.0" y="312.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">同时计算不依赖 halo 的内点</text><path d="M490,243 L595,243" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,305 L595,305" fill="none" stroke="#246548" stroke-width="2" marker-end="url(#arrow)"/><rect x="600" y="213" width="48" height="123" rx="7" fill="#f5e7c9" stroke="#bad0c2"/><text x="624" y="259" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">等</text><text x="624" y="293" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">待</text><rect x="674" y="244" width="298" height="58" rx="7" fill="#e8f1eb" stroke="#bad0c2"/><text x="823.0" y="280.0" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">halo 到齐后，计算边界</text><text x="24" y="386" font-size="19" fill="#254b38" text-anchor="start" font-weight="400">理想条件：串行 Tcomm + Tinterior + Tboundary → max(Tcomm, Tinterior) + Tboundary</text><text x="24" y="426" font-size="16" fill="#607668" text-anchor="start" font-weight="400">还要满足：传输能推进、资源不严重争用、发送与接收缓冲生命周期正确。图形宽度不代表实测时长。</text></svg>