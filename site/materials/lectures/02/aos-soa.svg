<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="360" viewBox="0 0 1010 360" role="img"><title>AoS 与 SoA 的字段布局及横向线程访问</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#fff"/><text x="25" y="34" font-size="24" fill="#254b38" text-anchor="start" font-weight="600">同一次指令：四个相邻线程各读一个 x</text><text x="25" y="75" font-size="19" fill="#254b38" text-anchor="start" font-weight="400">AoS · 每个对象放一起</text><text x="990" y="190" font-size="16" fill="#254b38" text-anchor="end" font-weight="400">地址递增 →</text><rect x="25" y="110" width="73" height="49" rx="5" fill="#216d50" stroke="#bfd2c5"/><text x="61" y="141" font-size="21" fill="white" text-anchor="middle" font-weight="400">x0</text><rect x="105" y="110" width="73" height="49" rx="5" fill="#f2f5f3" stroke="#bfd2c5"/><text x="141" y="141" font-size="21" fill="#677d6e" text-anchor="middle" font-weight="400">y0</text><rect x="185" y="110" width="73" height="49" rx="5" fill="#f2f5f3" stroke="#bfd2c5"/><text x="221" y="141" font-size="21" fill="#677d6e" text-anchor="middle" font-weight="400">z0</text><rect x="265" y="110" width="73" height="49" rx="5" fill="#216d50" stroke="#bfd2c5"/><text x="301" y="141" font-size="21" fill="white" text-anchor="middle" font-weight="400">x1</text><rect x="345" y="110" width="73" height="49" rx="5" fill="#f2f5f3" stroke="#bfd2c5"/><text x="381" y="141" font-size="21" fill="#677d6e" text-anchor="middle" font-weight="400">y1</text><rect x="425" y="110" width="73" height="49" rx="5" fill="#f2f5f3" stroke="#bfd2c5"/><text x="461" y="141" font-size="21" fill="#677d6e" text-anchor="middle" font-weight="400">z1</text><rect x="505" y="110" width="73" height="49" rx="5" fill="#216d50" stroke="#bfd2c5"/><text x="541" y="141" font-size="21" fill="white" text-anchor="middle" font-weight="400">x2</text><rect x="585" y="110" width="73" height="49" rx="5" fill="#f2f5f3" stroke="#bfd2c5"/><text x="621" y="141" font-size="21" fill="#677d