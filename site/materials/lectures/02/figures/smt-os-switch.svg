<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="585" viewBox="0 0 1120 585" role="img" aria-labelledby="title desc">
<title id="title">OS 上下文切换：更换其中一份驻留工作</title><desc id="desc">切换前，同一个物理核心的逻辑处理器0承载A、逻辑处理器1承载B。操作系统保存A的执行状态、恢复C的状态；切换后逻辑处理器0承载C，逻辑处理器1仍承载B。切换前硬件从A和B中选择就绪指令，切换后从C和B中选择。OS更换软件线程和硬件选择已驻留指令是两个层次。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">OS 上下文切换：更换其中一份驻留工作</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">同一个双路 SMT 核心：逻辑处理器 0 从 A 换成 C，逻辑处理器 1 仍承载 B。</text>
<rect x="40" y="122" width="450" height="362" rx="12" fill="#FFFFFF" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="265" y="155" font-size="25" fill="#20372F" text-anchor="middle" font-weight="700">切换前 · 同一个物理核心</text>
<rect x="60" y="180" width="410" height="74" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="265.0" y="209.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">逻辑处理器 0</text>
<text x="265.0" y="239.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">线程 A 的程序计数器与寄存器状态</text>
<rect x="60" y="282" width="410" height="74" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="265.0" y="311.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">逻辑处理器 1</text>
<text x="265.0" y="341.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">线程 B 的程序计数器与寄存器状态</text>
<line x1="385" y1="360" x2="385" y2="393" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 60 217 H 47 V 420 H 59" fill="none" stroke="#936015" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="401" width="410" height="60" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="265.0" y="423.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">硬件从 A / B 选指令</text>
<text x="265.0" y="453.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">共享执行资源</text>
<rect x="630" y="122" width="450" height="362" rx="12" fill="#FFFFFF" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="855" y="155" font-size="25" fill="#20372F" text-anchor="middle" font-weight="700">切换后 · 同一个物理核心</text>
<rect x="650" y="180" width="410" height="74" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="855.0" y="209.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">逻辑处理器 0</text>
<text x="855.0" y="239.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">线程 C 的程序计数器与寄存器状态</text>
<rect x="650" y="282" width="410" height="74" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="855.0" y="311.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">逻辑处理器 1</text>
<text x="855.0" y="341.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">线程 B 的程序计数器与寄存器状态</text>
<line x1="975" y1="360" x2="975" y2="393" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 650 217 H 637 V 420 H 649" fill="none" stroke="#936015" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="401" width="410" height="60" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="855.0" y="423.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">硬件从 C / B 选指令</text>
<text x="855.0" y="453.48" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">共享执行资源</text>
<rect x="507" y="180" width="106" height="164" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="560.0" y="239.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">OS</text>
<text x="560.0" y="269.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">保存 A</text>
<text x="560.0" y="299.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">恢复 C</text>
<line x1="471" y1="217" x2="501" y2="217" stroke="#936015" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="617" y1="217" x2="646" y2="217" stroke="#936015" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560" y="382" font-size="18" fill="#566A63" text-anchor="middle" font-weight="400">不是每周期</text>
<text x="560" y="409" font-size="18" fill="#566A63" text-anchor="middle" font-weight="400">都做一次</text>
<text x="560" y="436" font-size="18" fill="#566A63" text-anchor="middle" font-weight="400">保存 / 恢复</text>
<text x="560" y="525" font-size="25" fill="#20372F" text-anchor="middle" font-weight="600">逻辑处理器数量没有变化；变化的是它承载的软件线程。</text>
<line x1="32" y1="536" x2="1088" y2="536" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="565" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">A 的状态由 OS 保存以便以后恢复；C 在切换前不在这个核心驻留。两侧图不是按比例的时间轴。</text>
</g></svg>
