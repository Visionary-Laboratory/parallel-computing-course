<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">硬件多线程：从另一份驻留上下文中找工作</title><desc id="desc">回顾第7页：r0等待时推进r1，两者是同一线程内的独立计算链。本页：T0没有就绪指令时，从另一份已驻留的线程上下文T1发射。教学模型每周期最多发射一条指令，每份上下文发射3周期后等待12周期。T0在0至2、15至17发射，T1在3至5、18至20发射。最下行是核心实际发射，6至14有空档。两份上下文的稳态利用率6/15=40%；不缩短等待，不复制执行单元，也不需要操作系统换入换出。</desc>
