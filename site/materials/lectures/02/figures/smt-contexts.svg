<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">双路 SMT：两份执行状态，共用一个核心</title><desc id="desc">一个物理核心包含两个硬件线程上下文，对操作系统呈现为逻辑处理器0和1。上下文0保留软件线程A的程序计数器和寄存器状态，上下文1保留B的独立状态。硬件可从两者选择就绪指令，共享整数、浮点或向量、访存执行资源；这不是两个完整物理核心。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">双路 SMT：两份执行状态，共用一个核心</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">软件线程 A、B 已分别被操作系统安排到两个逻辑处理器。</text>
<rect x="43" y="116" width="1034" height="380" rx="12" fill="#FFFFFF" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="66" y="147" font-size="24" fill="#20372F" text-anchor="start" font-weight="700">一个物理核心</text>
<rect x="83" y="168" width="439" height="93" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="302.5" y="207.32" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">硬件上下文 0 / 逻辑处理器 0</text>
<text x="302.5" y="237.32" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">线程 A：程序计数器、寄存器状态</text>
<line x1="302" y1="263" x2="302" y2="302" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="597" y="168" width="439" height="93" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="816.5" y="207.32" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">硬件上下文 1 / 逻辑处理器 1</text>
<text x="816.5" y="237.32" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">线程 B：程序计数器、寄存器状态</text>
<line x1="816" y1="263" x2="816" y2="302" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="140" y="311" width="840" height="60" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="560.0" y="349.84" font-size="26" fill="#20372F" text-anchor="middle" font-weight="600">硬件调度：从已驻留上下文中选择就绪指令</text>
<line x1="217" y1="373" x2="217" y2="412" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="84" y="421" width="265" height="50" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="216.5" y="454.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">整数运算</text>
<line x1="560" y1="373" x2="560" y2="412" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="427" y="421" width="265" height="50" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="559.5" y="454.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">浮点 / 向量运算</text>
<line x1="903" y1="373" x2="903" y2="412" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="770" y="421" width="265" height="50" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="902.5" y="454.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">加载 / 存储</text>
<text x="560" y="535" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">两份状态提供更多候选指令；下方的执行资源仍然共享。</text>
<line x1="32" y1="561" x2="1088" y2="561" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="590" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">示意逻辑关系，省略缓存等部件；不规定真实处理器的发射宽度或寄存器物理实现。</text>
</g></svg>
