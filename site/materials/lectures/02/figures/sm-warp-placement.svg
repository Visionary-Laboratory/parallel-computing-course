<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">一个 SM：两个 block，八个驻留 warp</title><desc id="desc">SM0示意驻留block0和block6，各有128线程、4个warp。子分区s的调度器示意管理B0.Ws和B6.Ws，s为0到3，具体编号映射不是CUDA保证。一个block的warp跨越四个子分区，一个子分区管理两个block的warp。各线程状态驻留于寄存器，子分区共享SM级L1和shared memory物理资源，不表示不同block共享彼此的内存区域。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">一个 SM：两个 block，八个驻留 warp</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">沿用每 block 128 线程；四列是 V100 子分区，warp 归属仅作教学示意。</text>
