<text x="393.5" y="162.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">Block 0：128 线程 / 4 warps</text>
<rect x="631" y="124" width="432" height="60" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="847.0" y="162.16" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">Block 6：128 线程 / 4 warps</text>
<rect x="45" y="211" width="232" height="292" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="161" y="240" font-size="24" fill="#20372F" text-anchor="middle" font-weight="700">子分区 0</text>
