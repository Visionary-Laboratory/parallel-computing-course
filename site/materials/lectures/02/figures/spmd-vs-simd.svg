</g>
<rect x="36" y="600" width="1048" height="132" rx="8" fill="#FFFFFF" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="60" y="632" font-size="23" fill="#20372F" text-anchor="start" font-weight="700">GPU 上的对应关系：线程各有状态，指令按组发射</text>
<rect x="60" y="649" width="250" height="65" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="185.0" y="673.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">SPMD：许多逻辑线程</text>
<text x="185.0" y="703.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">各自的编号与数据</text>
<line x1="318" y1="682" x2="351" y2="682" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="359" y="649" width="350" height="65" rx="8" fill="#FFF1CE" stroke="#936015" stroke-width="1.5"/>
<text x="534.0" y="673.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">SIMT：按 warp（线程束）组织</text>
<text x="534.0" y="703.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">一条指令作用于活跃线程</text>
<line x1="717" y1="682" x2="750" y2="682" stroke="#936015" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="758" y="649" width="302" height="65" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="909.0" y="673.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">执行通道成组处理</text>
<text x="909.0" y="703.64" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">具有 SIMD 式的数据并行</text>
<text x="560" y="759" font-size="22" fill="#20372F" text-anchor="middle" font-weight="600">同一份程序 ≠ 同一时刻执行同一条指令；程序实例也不等于物理核心。</text>
<line x1="32" y1="771" x2="1088" y2="771" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="800" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">金色表示指令控制，蓝色表示输入，绿色表示结果，斜线表示本条操作不生效。布局不表示耗时。</text>
</g></svg>
