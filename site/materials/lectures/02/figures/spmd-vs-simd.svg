<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">SPMD 是程序的组织方式，执行可以不同</title><desc id="desc">顶层是一份worker和四个程序实例，按编号处理各自数据，这是SPMD。向下分成两种执行安排：左边MIMD多核各有独立控制，核心0和2乘2，核心1和3加1；右边SIMD以掩码1010乘2、掩码0101加1。两边输出相同，但不表示四个CPU线程自动合成向量指令。下方预览GPU：许多SPMD逻辑线程按warp组织，通过SIMT让一条指令作用于当前活跃线程，由执行通道成组处理数据。图中不承诺时序、加速比或线程与物理单元一一对应。</desc>
