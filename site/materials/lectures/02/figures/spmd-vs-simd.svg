<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">SPMD 是程序的组织方式，执行可以不同</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">输入 x = [1, −2, 3, −4]；规则：正数乘 2，否则加 1。</text>
