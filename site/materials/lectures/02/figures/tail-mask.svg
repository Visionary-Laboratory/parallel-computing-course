<title id="title">35 个元素：前 4 组装满，最后一组只剩 3 个</title><desc id="desc">35个独立元素按8通道分为5组。前四组依次处理下标0到7、8到15、16到23和24到31，全部有效。最后一组只有通道0到2处理下标32、33、34，另外五条通道没有数据，掩码为11100000，不能访问下标35到39。有效元素35个，对应40个通道位置，比例87.5%，不代表速度或硬件利用率实测。</desc>
