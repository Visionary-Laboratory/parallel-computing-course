<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
<title id="title">寄存器溢出：保留一个中间值，多了存与取</title><desc id="desc">寄存器够用时，中间值v留在寄存器，后续计算直接使用。需要腾出寄存器时，编译器可能先将v存入local memory，后续使用前再读回寄存器。local表示线程私有，它由设备显存支撑，可以经过缓存，不能当作block共享内存。这个过程增加存取指令与数据访问，但不表示每次访问都到HBM。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">寄存器溢出：保留一个中间值，多了存与取</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">v 是后续还要使用的中间值；下方画的是常见的 local memory 溢出路径。</text>
<text x="51" y="129" font-size="24" fill="#176B52" text-anchor="start" font-weight="600">寄存器够用：值留在片上</text>
<rect x="51" y="155" width="330" height="70" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="216.0" y="198.84" font-size="26" fill="#20372F" text-anchor="middle" font-weight="600">寄存器保留 v</text>
<line x1="405" y1="190" x2="705" y2="190" stroke="#176B52" stroke-width="3" marker-end="url(#arrow)"/>
<text x="555" y="175" font-size="23" fill="#176B52" text-anchor="middle" font-weight="400">直接使用</text>
<rect x="731" y="155" width="338" height="70" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="900.0" y="198.84" font-size="26" fill="#20372F" text-anchor="middle" font-weight="600">后续计算使用 v</text>
<text x="51" y="283" font-size="24" fill="#B74836" text-anchor="start" font-weight="600">需要腾空间：编译器为 v 增加存出、读回</text>
<rect x="51" y="311" width="220" height="76" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="161.0" y="356.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">寄存器中的 v</text>
<rect x="331" y="311" width="280" height="76" rx="8" fill="#FBECE7" stroke="#B74836" stroke-width="1.5"/>
<text x="471.0" y="356.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">存入 local memory</text>
<rect x="671" y="311" width="190" height="76" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="766.0" y="356.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">读回寄存器</text>
<rect x="921" y="311" width="148" height="76" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="995.0" y="356.82" font-size="23" fill="#20372F" text-anchor="middle" font-weight="600">后续使用 v</text>
<line x1="281" y1="349" x2="321" y2="349" stroke="#B74836" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="621" y1="349" x2="661" y2="349" stroke="#B74836" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="871" y1="349" x2="911" y2="349" stroke="#B74836" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="51" y="416" width="1018" height="53" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="560.0" y="450.66" font-size="24" fill="#20372F" text-anchor="middle" font-weight="600">local = 线程私有；可经过缓存，必要时访问设备显存。</text>
<line x1="32" y1="481" x2="1088" y2="481" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="510" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">额外存取不等于每次访问 HBM；具体溢出哪些值、多少次，取决于编译结果。</text>
</g></svg>
