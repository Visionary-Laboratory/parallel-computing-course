<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">每通道分一段：同一轮读分散元素</title><desc id="desc">每通道分一段：同一轮读分散元素。横向绿色第一行表示第0轮8个通道共同读取下标0、8、16、24、32、40、48、56；纵向蓝色虚线框表示通道0依次读取下标0、1、2、3、4、5、6、7。两图均覆盖0到63且无重复，工作量相同。横向相邻便于连续向量加载；纵向连续不保证横向连续。轮次不表示周期，不据此预测加速倍数。</desc>
