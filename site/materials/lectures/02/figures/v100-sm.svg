<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">放大 SM 0：四个子分区，共享片上存储</title><desc id="desc">放大 SM 0：四个子分区，共享片上存储。沿用整卡图的绿色选区；每个子分区都有独立的 warp 调度器与寄存器文件</desc>
