<rect x="716" y="207" width="135" height="44" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="783.5" y="236.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">T0 · I0</text>
<rect x="875" y="207" width="135" height="44" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
