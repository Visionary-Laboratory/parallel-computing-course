<rect x="716" y="327" width="135" height="44" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="783.5" y="356.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">T0 · I2</text>
