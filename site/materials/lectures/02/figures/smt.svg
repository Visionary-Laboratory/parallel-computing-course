<text x="60" y="414" font-size="20" fill="#566A63" text-anchor="start" font-weight="400">周期 3</text>
<rect x="166" y="387" width="135" height="44" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="233.5" y="416.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">T0 · I3</text>
<rect x="325" y="387" width="135" height="44" rx="8" fill="url(#inactive)" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="392.5" y="416.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">空闲</text>
<text x="610" y="145" font-size="25" fill="#20372F" text-anchor="start" font-weight="600">T0 + T1 共享双发射</text>
