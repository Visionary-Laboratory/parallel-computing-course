<rect x="716" y="387" width="135" height="44" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="783.5" y="416.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">T0 · I3</text>
<rect x="875" y="387" width="135" height="44" rx="8" fill="#E7F1F8" stroke="#246B96" stroke-width="1.5"/>
<text x="942.5" y="416.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">T1 · I3</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">示意每周期恰有两条可同时执行的独立指令；SMT 不增加执行单元，实际仍受端口等资源约束。</text>
</g></svg>
