<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">SMT：两个线程共享同一个核心的发射槽位</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">一个假想双发射核心；线程互补的就绪指令可以减少空槽</text>
