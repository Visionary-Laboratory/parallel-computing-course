<text x="60" y="294" font-size="20" fill="#566A63" text-anchor="start" font-weight="400">周期 1</text>
<rect x="166" y="267" width="135" height="44" rx="8" fill="#E4F2EB" stroke="#176B52" stroke-width="1.5"/>
<text x="233.5" y="296.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">T0 · I1</text>
<rect x="325" y="267" width="135" height="44" rx="8" fill="url(#inactive)" stroke="#CFDCD5" stroke-width="1.5"/>
<text x="392.5" y="296.14" font-size="21" fill="#20372F" text-anchor="middle" font-weight="600">空闲</text>
<text x="60" y="354" font-size="20" fill="#566A63" text-anchor="start" font-weight="400">周期 2</text>
