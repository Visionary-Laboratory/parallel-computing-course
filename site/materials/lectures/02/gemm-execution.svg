<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img"><title>典型分块 GEMM 的输出 tile、block 协作、数据和状态关系</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#fff"/><text x="25" y="34" font-size="24" fill="#254b38" text-anchor="start" font-weight="600">分块 GEMM：一块输出，连接起数据与执行</text><text x="25" y="80" font-size="20" fill="#254b38" text-anchor="start" font-weight="400">C 的输出 tiles</text><rect x="25" y="98" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="67" y="98" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="109" y="98" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="151" y="98" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="25" y="140" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="67" y="140" width="37" height="37" rx="5" fill="#216d50" stroke="#bfd2c5"/><rect x="109" y="140" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="151" y="140" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="25" y="182" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="67" y="182" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="109" y="182" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="151" y="182" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="25" y="224" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="67" y="224" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="109" y="224" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><rect x="151" y="224" width="37" height="37" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><text x="25" y="295" font-size="17" fill="#254b38" text-anchor="start" font-weight="400">一个 block 负责其中一块</text><text x="230" y="183" font-size="36" fill="#216d50" text-anchor="start" font-weight="400">→</text><rect x="290" y="60" width="685" height="260" rx="5" fill="#f6f9f7" stroke="#bfd2c5"/><text x="312" y="92" font-size="21" fill="#254b38" text-anchor="start" font-weight="600">SM 中驻留的一个 block</text><rect x="313" y="115" width="190" height="68" rx="5" fill="white" stroke="#bfd2c5"/><text x="408.0" y="143" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">A/B 子块</text><text x="408.0" y="167" font-size="17" fill="#597362" text-anchor="middle" font-weight="400">shared memory</text><rect x="555" y="115" width="185" height="68" rx="5" fill="white" stroke="#bfd2c5"/><text x="647.5" y="143" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">多个 warp</text><text x="647.5" y="167" font-size="17" fill="#597362" text-anchor="middle" font-weight="400">分工与协作</text><rect x="780" y="115" width="175" height="68" rx="5" fill="white" stroke="#bfd2c5"/><text x="867.5" y="143" font-size="20" fill="#254b38" text-anchor="middle" font-weight="400">输出部分和</text><text x="867.5" y="167" font-size="17" fill="#597362" text-anchor="middle" font-weight="400">寄存器状态</text><text x="520" y="158" font-size="26" fill="#216d50" text-anchor="start" font-weight="400">→</text><text x="754" y="158" font-size="26" fill="#216d50" text-anchor="start" font-weight="400">→</text><text x="316" y="219" font-size="20" fill="#254b38" text-anchor="start" font-weight="400">沿 K 维继续：装入下一子块 → 计算 → 累加</text><text x="316" y="257" font-size="18" fill="#246b96" text-anchor="start" font-weight="400">有独立工作时，调度可推进其他就绪 warp</text><text x="316" y="288" font-size="17" fill="#597362" text-anchor="start" font-weight="400">异步搬运与双缓冲还需要资源预算和正确同步</text><rect x="25" y="345" width="303" height="73" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><text x="41" y="374" font-size="20" fill="#216d50" text-anchor="start" font-weight="600">数据账</text><text x="41" y="401" font-size="18" fill="#254b38" text-anchor="start" font-weight="400">复用减少远端字节</text><rect x="350" y="345" width="303" height="73" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><text x="366" y="374" font-size="20" fill="#216d50" text-anchor="start" font-weight="600">空间账</text><text x="366" y="401" font-size="18" fill="#254b38" text-anchor="start" font-weight="400">寄存器 / 共享存储</text><rect x="675" y="345" width="303" height="73" rx="5" fill="#e9f2ec" stroke="#bfd2c5"/><text x="691" y="374" font-size="20" fill="#216d50" text-anchor="start" font-weight="600">执行账</text><text x="691" y="401" font-size="18" fill="#254b38" text-anchor="start" font-weight="400">就绪指令 / 有效通道</text></svg>