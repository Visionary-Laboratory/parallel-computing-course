<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">FA1 双层循环：固定 K/V 块，依次遍历 Q 块</title>
  <desc id="desc">将 Q、K、V 各分为两个块。外层 j 为零时固定 K0、V0，内层先用 Q0 更新 O0，再用 Q1 更新 O1。外层换到 j 为一，固定 K1、V1，内层重新从 Q0 到 Q1，继续更新各自输出。编号一到四表示循环遍历次序，不表示所有线程串行执行。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#246b96"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a84940"/></marker>
  </defs>
  <rect width="1120" height="260" rx="10" fill="#fff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" fill="#20372f">
    <text x="24" y="30" fill="#a84940" font-weight="700">Outer Loop（外层）：换 K/V 块</text>
    <text x="440" y="30" fill="#246b96" font-weight="700">Inner Loop（内层）：Q₀ → Q₁</text>
    <rect x="24" y="52" width="300" height="72" rx="8" fill="#fff0ec" stroke="#dba59b"/>
    <text x="174" y="82" text-anchor="middle" font-weight="700">j = 0：固定 K₀、V₀</text>
    <text x="174" y="109" text-anchor="middle" font-size="19">这块 K/V 供两个 Q 块复用</text>
    <rect x="390" y="52" width="320" height="72" rx="8" fill="#eaf3fa" stroke="#9dbdd3"/>
    <text x="550" y="83" text-anchor="middle" font-weight="700">① i = 0：使用 Q₀</text>
    <text x="550" y="110" text-anchor="middle" font-size="20">更新 O₀ 的累计结果</text>
    <rect x="770" y="52" width="320" height="72" rx="8" fill="#eaf3fa" stroke="#9dbdd3"/>
    <text x="930" y="83" text-anchor="middle" font-weight="700">② i = 1：使用 Q₁</text>
    <text x="930" y="110" text-anchor="middle" font-size="20">更新 O₁ 的累计结果</text>
    <path d="M330 88 H378" fill="none" stroke="#246b96" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <path d="M716 88 H758" fill="none" stroke="#246b96" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <path d="M174 130 V164" fill="none" stroke="#a84940" stroke-width="3" marker-end="url(#red-arrow)"/>
    <text x="199" y="153" fill="#a84940" font-size="18">内层走完，再换下一块</text>
    <rect x="24" y="176" width="300" height="72" rx="8" fill="#fff0ec" stroke="#dba59b"/>
    <text x="174" y="206" text-anchor="middle" font-weight="700">j = 1：固定 K₁、V₁</text>
    <text x="174" y="233" text-anchor="middle" font-size="19">Q 块从头再遍历一次</text>
    <rect x="390" y="176" width="320" height="72" rx="8" fill="#eaf3fa" stroke="#9dbdd3"/>
    <text x="550" y="207" text-anchor="middle" font-weight="700">③ i = 0：再次使用 Q₀</text>
    <text x="550" y="234" text-anchor="middle" font-size="20">接着更新 O₀</text>
    <rect x="770" y="176" width="320" height="72" rx="8" fill="#eaf3fa" stroke="#9dbdd3"/>
    <text x="930" y="207" text-anchor="middle" font-weight="700">④ i = 1：再次使用 Q₁</text>
    <text x="930" y="234" text-anchor="middle" font-size="20">接着更新 O₁</text>
    <path d="M330 212 H378" fill="none" stroke="#246b96" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <path d="M716 212 H758" fill="none" stroke="#246b96" stroke-width="3" marker-end="url(#blue-arrow)"/>
  </g>
</svg>
