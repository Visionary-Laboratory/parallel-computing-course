<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">均值投影为中心，协方差投影为足迹</title><desc id="desc">均值投影为中心，协方差投影为足迹。局部线性近似：Σ₂D = J Rcamera Σ₃D Rcameraᵀ Jᵀ；像素滤波项另加。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><pattern id="inactive" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDF1F3"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D7DFE3" stroke-width="1"/></pattern></defs>
<rect width="1120" height="100%" rx="10" fill="#FFFFFF"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#20372F">
<rect x="32" y="29" width="5" height="32" rx="2" fill="#176B52" stroke="none" stroke-width="1.5"/>
<text x="51" y="54" font-size="28" fill="#20372F" text-anchor="start" font-weight="700">均值投影为中心，协方差投影为足迹</text>
<text x="51" y="86" font-size="19" fill="#566A63" text-anchor="start" font-weight="400">局部线性近似：Σ₂D = J Rcamera Σ₃D Rcameraᵀ Jᵀ；像素滤波项另加。</text>
<ellipse cx="247" cy="277" rx="130" ry="51" transform="rotate(-28 247 277)" stroke="#176B52" stroke-width="2" fill="#E4F2EB" fill-opacity="0.8"/>
<ellipse cx="247" cy="277" rx="55" ry="112" transform="rotate(-28 247 277)" stroke="#176B52" stroke-width="2" fill="none" fill-opacity="0.8"/>
<circle cx="247" cy="277" r="5" fill="#FFF1CE" stroke="#936015" stroke-width="2"/>
<text x="247" y="449" font-size="23" fill="#20372F" text-anchor="middle" font-weight="700">3D：有方向、有尺度</text>
<line x1="406" y1="277" x2="650" y2="277" stroke="#246B96" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="525" y="245" font-size="20" fill="#20372F" text-anchor="middle" font-weight="400">相机变换 + 投影 J</text>
<rect x="716" y="133" width="331" height="270" rx="8" fill="#EDF1F3" stroke="#CFDCD5" stroke-width="1.5"/>
<ellipse cx="881" cy="268" rx="116" ry="38" transform="rotate(-20 881 268)" stroke="#246B96" stroke-width="2" fill="#E7F1F8" fill-opacity="0.8"/>
<circle cx="881" cy="268" r="5" fill="#FFF1CE" stroke="#936015" stroke-width="2"/>
<text x="881" y="449" font-size="23" fill="#20372F" text-anchor="middle" font-weight="700">2D：椭圆足迹</text>
<line x1="32" y1="511" x2="1088" y2="511" stroke="#CFDCD5" stroke-width="1"/>
<text x="36" y="540" font-size="18" fill="#566A63" text-anchor="start" font-weight="400">高斯的透视投影并不严格仍是高斯；J 是均值附近的 Jacobian，这一步是渲染近似。</text>
</g></svg>
